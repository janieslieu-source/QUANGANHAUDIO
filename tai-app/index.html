<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="robots" content="noindex">
<title>Tải app Quang Anh MT</title>
<link rel="icon" href="../logo.png">
<style>
  :root{--brand:#1d4ed8;--ink:#0f172a;--muted:#64748b;--card:#fff;--bg:#eef2ff}
  @media (prefers-color-scheme: dark){:root{--ink:#e2e8f0;--muted:#94a3b8;--card:#111827;--bg:#0b1020}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(120% 60% at 50% 0%,#3b82f6 0%,#1d4ed8 45%,#172554 100%) fixed;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:420px;background:var(--card);border-radius:26px;border-top:5px solid #ef4444;padding:28px 22px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
  .ic{width:150px;height:150px;filter:drop-shadow(0 8px 12px rgba(15,23,42,.25))}
  h1{font-size:24px;margin:14px 0 4px} .sub{color:var(--muted);font-size:14px;margin:0}
  .btn{display:block;margin:22px 0 10px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 10px 20px -8px rgba(29,78,216,.7)}
  .web{display:block;padding:12px;border-radius:14px;border:1.5px solid #c7d2fe;color:var(--brand);text-decoration:none;font-weight:600}
  ol{text-align:left;font-size:14px;line-height:1.6;padding-left:20px;margin:18px 0 0}
  .ver{font-size:13px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
  <div class="card">
    <img class="ic" src="../logo.png" alt="">
    <h1>Quang Anh MT</h1>
    <p class="sub">Phần mềm bảo hành – sửa chữa – bán hàng – kho</p>
    <a class="btn" href="QuangAnhMT.apk" download>⬇️ Tải app cho Android</a>
    <div class="ver" id="ver"></div>
    <a class="web" href="../">🌐 Mở bản web (iPhone / máy tính)</a>
    <ol>
      <li>Bấm <b>Tải app cho Android</b>.</li>
      <li>Tải xong, bấm mở file <b>QuangAnhMT.apk</b>.</li>
      <li>Nếu máy hỏi, bật <b>Cho phép cài từ nguồn này</b> rồi bấm <b>Cài đặt</b>.</li>
    </ol>
  </div>
<script>
  fetch("version.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(v => {
    if (v) document.getElementById("ver").textContent = "Bản " + v.version + " · cập nhật " + v.date;
  }).catch(() => {});
</script>
</body>
</html>
