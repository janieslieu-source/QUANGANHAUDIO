<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quản lý bảo hành</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#fff; --ink:#15201d; --muted:#66736f; --line:#e2e7e5;
    --brand:#0f766e; --ok:#15803d; --okbg:#dcfce7;
    --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; --info:#1d4ed8; --infobg:#dbeafe;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0d1312;--card:#161e1c;--ink:#e8efed;--muted:#94a3a0;--line:#26312e;
      --okbg:#13301f;--warnbg:#3a2a0c;--badbg:#3b1414;--infobg:#172554;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93c5fd}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .hide{display:none!important}
  button{font-family:inherit}

  /* login */
  #login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
    background:linear-gradient(160deg,#0f766e,#134e4a)}
  .lcard{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .lcard h1{margin:0 0 2px;font-size:21px;text-align:center}
  .lcard p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:14px}
  .depts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
  .dept{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;color:var(--ink)}
  .dept .ic{font-size:26px;display:block} .dept b{font-size:13px}
  .dept.sel{border-color:var(--brand);background:rgba(15,118,110,.08)}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px;text-align:center}

  /* header */
  header{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;position:sticky;top:0;z-index:5}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1.t{font-size:18px;margin:0;font-weight:700}
  .hright{display:flex;align-items:center;gap:8px}
  .sync{font-size:11px;opacity:.85;display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#fde68a}.dot.on{background:#86efac}
  .iconbtn{position:relative;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer}
  .cnt{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
  .tabs{display:flex;margin-top:10px}
  .tab{position:relative;flex:1;background:none;border:0;color:rgba(255,255,255,.7);font-weight:600;font-size:12px;padding:8px 2px 9px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;line-height:1.25}
  .tab .ti{display:block;font-size:18px}
  .tab.on{color:#fff;border-bottom-color:#fff}
  .tab .cnt{position:absolute;top:3px;right:calc(50% - 22px)}

  main{padding:14px 14px calc(env(safe-area-inset-bottom) + 40px);max-width:720px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .panel h3{margin:0 0 10px;font-size:15px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .c-ok b{color:var(--ok)} .c-warn b{color:var(--warn)} .c-bad b{color:var(--bad)} .c-info b{color:var(--info)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
  .panel .item{background:var(--bg)}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pname{font-weight:650}
  .sub{color:var(--muted);font-size:13px}
  .badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
  .b-bad{background:var(--badbg);color:var(--bad)} .b-info{background:var(--infobg);color:var(--info)}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
  .tag.bh{background:var(--okbg);color:var(--ok)} .tag.vc{background:var(--infobg);color:var(--info)} .tag.sc{background:var(--warnbg);color:var(--warn)}
  .lateitem{border:2px solid var(--bad)!important;background:var(--badbg)!important}
  .latebox{border:2px solid var(--bad);background:var(--badbg)} .latebox h3{color:var(--bad)}
  .stat.late{background:var(--bad)!important;animation:pulse 1.6s infinite} .stat.late b,.stat.late span{color:#fff!important}
  @keyframes pulse{50%{opacity:.75}}
  .empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
  .chip.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .hbar{display:grid;grid-template-columns:1fr 2fr 34px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
  .hbar .track{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
  .hbar .track i{display:block;height:100%;background:var(--brand);border-radius:9px}
  .hbar .n{text-align:right;font-weight:600}
  .hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* forms */
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-family:inherit}
  .panel input,.panel textarea,.panel select{background:var(--bg)}
  textarea{min-height:60px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .opt{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;color:var(--ink);font-weight:650;font-size:15px}
  .opt .ic{display:block;font-size:24px;margin-bottom:2px}
  .opt.sel{border-color:var(--brand);background:rgba(15,118,110,.1)}
  .opt.sel::after{content:" ✓";color:var(--brand)}
  .wbox{border-radius:12px;padding:14px;margin-top:12px;text-align:center}
  .wbox b{display:block;font-size:20px}
  .found{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--infobg);color:var(--info)}
  .btns{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;background:var(--line);color:var(--ink)}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.danger{background:var(--badbg);color:var(--bad)}
  .btn.okb{background:var(--ok);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{flex:none;padding:8px 12px;font-size:13px}
  .cardbtns{display:flex;gap:8px;margin-top:10px}
  .cardbtns .btn{padding:10px;font-size:14px}

  /* sheets */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
  .sheet-bg.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .2s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{font-size:18px;margin:4px 0 12px}
  .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 8px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin:6px 0 12px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
  .tl{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:14px}
  .tl div{position:relative;margin-bottom:10px;font-size:14px}
  .tl div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
  .reason{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}

  /* thông báo */
  #banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-150%);transition:transform .3s ease;
    width:calc(100% - 20px);max-width:520px;background:#15201d;color:#fff;border-radius:14px;padding:12px 14px;z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  #banner.show{transform:translate(-50%,0)}
  #banner .bi{font-size:22px;line-height:1}
  #banner b{display:block;font-size:14px} #banner span{font-size:13px;opacity:.85}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);
    background:#15201d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:60;max-width:90%}
  .noti{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .noti.new b::before{content:"● ";color:#ef4444}
  #pdfStage{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111;font:14px/1.5 Arial,Helvetica,sans-serif;padding:48px 56px}
  #pdfStage h1{font-size:22px;text-align:center;margin:0 0 4px;letter-spacing:.02em}
  #pdfStage .c{text-align:center;color:#555;margin:0 0 22px}
  #pdfStage h2{font-size:15px;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid #0f766e;color:#0f766e}
  #pdfStage table{width:100%;border-collapse:collapse}
  #pdfStage td{padding:6px 8px;border:1px solid #ccc;vertical-align:top}
  #pdfStage td:first-child{width:32%;background:#f3f5f4;font-weight:bold}
  #pdfStage .sig{display:flex;justify-content:space-around;margin-top:40px;text-align:center}
  #pdfStage .sig div{width:30%} #pdfStage .sig i{display:block;color:#666;font-size:12px;margin-bottom:70px}
  .link{background:none;border:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:4px}
  @media (prefers-color-scheme: dark){.link{color:#5eead4}}
</style>
</head>
<body>

<div id="banner" class="hide-init"><span class="bi">🔔</span><div><b id="bnTitle"></b><span id="bnText"></span></div></div>

<!-- ================= ĐĂNG NHẬP ================= -->
<div id="login">
  <form class="lcard" id="loginForm">
    <h1>🛡️ Quản lý bảo hành</h1>
    <p>Chọn bộ phận và nhập mật mã</p>
    <div class="depts">
      <button type="button" class="dept sel" data-role="bh"><span class="ic">🧾</span><b>Bảo hành</b></button>
      <button type="button" class="dept" data-role="gd"><span class="ic">👔</span><b>Giám đốc</b></button>
      <button type="button" class="dept" data-role="kt"><span class="ic">🔧</span><b>Kỹ thuật</b></button>
      <button type="button" class="dept" data-role="vc"><span class="ic">🚚</span><b>Vận chuyển</b></button>
    </div>
    <input id="pw" type="password" placeholder="Mật mã" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="err" id="pwErr"></div>
    <div class="btns" style="margin-top:8px"><button class="btn pri" type="submit">Vào</button></div>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hide">
  <header>
    <div class="top">
      <h1 class="t" id="appTitle">Bảo hành</h1>
      <div class="hright">
        <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">…</span></div>
        <button class="iconbtn" id="bell" aria-label="Thông báo">🔔<span class="cnt hide" id="bellCnt">0</span></button>
        <button class="iconbtn" id="logout">Thoát</button>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab" data-tab="bh"><span class="ti">🧾</span>Bảo hành<span class="cnt hide"></span></button>
      <button class="tab" data-tab="gd"><span class="ti">👔</span>Giám đốc<span class="cnt hide"></span></button>
      <button class="tab" data-tab="kt"><span class="ti">🔧</span>Kỹ thuật<span class="cnt hide"></span></button>
      <button class="tab" data-tab="vc"><span class="ti">🚚</span>Vận chuyển<span class="cnt hide"></span></button>
    </nav>
  </header>

  <main>
    <!-- ===== BẢO HÀNH ===== -->
    <section id="v-bh">
      <form class="panel" id="recvForm" autocomplete="off">
        <h3>📥 Tiếp nhận hàng</h3>
        <label>Tên khách hàng *</label><input name="customer" required>
        <label>Số điện thoại</label><input name="phone" type="tel" inputmode="tel">
        <label>Tên sản phẩm *</label><input name="product" required>
        <label>Số seri *</label><input name="serial" required placeholder="Gõ số seri…">
        <div id="foundBox"></div>

        <div id="typeWrap" class="hide">
          <label>Loại hàng</label>
          <div class="choice">
            <button type="button" class="opt" data-type="bh"><span class="ic">🛡️</span>Bảo hành</button>
            <button type="button" class="opt" data-type="sc"><span class="ic">🛠️</span>Sửa chữa</button>
          </div>

          <div id="bhWrap" class="hide">
            <div id="buyFields" class="two">
              <div><label>Ngày mua *</label><input name="purchaseDate" type="date"></div>
              <div><label>Thời hạn BH</label>
                <select name="months">
                  <option value="3">3 tháng</option><option value="6">6 tháng</option>
                  <option value="12" selected>12 tháng</option><option value="18">18 tháng</option>
                  <option value="24">24 tháng</option><option value="36">36 tháng</option><option value="60">60 tháng</option>
                </select></div>
            </div>
            <div id="wBox"></div>
          </div>

          <div id="issueWrap" class="hide">
            <label>Mô tả lỗi / tình trạng *</label><textarea name="issue"></textarea>
            <div class="btns"><button class="btn pri" type="submit" id="recvBtn">Gửi</button></div>
          </div>
        </div>
      </form>

      <div class="panel"><h3>⏳ Đang xử lý</h3><div class="list" id="trackList"></div></div>
      <div class="panel"><div class="row"><h3>✅ Đã trả khách</h3></div><div class="list" id="doneList"></div></div>
    </section>

    <!-- ===== GIÁM ĐỐC ===== -->
    <section id="v-gd" class="hide">
      <div class="panel"><h3>🛠️ Hàng sửa chữa chờ duyệt <span class="sub" id="gdCnt"></span></h3><div class="list" id="gdList"></div></div>
      <div id="gdStats"></div>
    </section>

    <!-- ===== VẬN CHUYỂN ===== -->
    <section id="v-vc" class="hide">
      <div class="panel"><h3>📦 Chờ gửi trả khách <span class="sub" id="vcCnt"></span></h3><div class="list" id="vcList"></div></div>
      <div class="panel"><h3>🗂️ Đã gửi trả – lưu trữ</h3>
        <div style="margin-bottom:10px"><input id="vcQ" type="search" placeholder="Tìm seri, khách, chành xe, mã vận đơn…" autocomplete="off"></div>
        <div class="list" id="vcDone"></div></div>
    </section>

    <!-- ===== KỸ THUẬT ===== -->
    <section id="v-kt" class="hide">
      <div class="chips" id="ktChips"></div>
      <div class="list" id="ktList"></div>
    </section>
  </main>
</div>

<!-- Mật mã chuyển tab -->
<div class="sheet-bg" id="unlockBg">
  <form class="sheet" id="unlockForm">
    <div class="grab"></div>
    <h2 id="unlockTitle">Nhập mật mã</h2>
    <div class="reason hide" id="unlockReason"></div>
    <input id="pw2" type="password" placeholder="Mật mã" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="err" id="pw2Err"></div>
    <div class="btns">
      <button type="button" class="btn" data-close="unlockBg">Để sau</button>
      <button type="submit" class="btn pri">Vào</button>
    </div>
  </form>
</div>

<div class="sheet-bg" id="actBg"><form class="sheet" id="actForm"></form></div>
<div class="sheet-bg" id="detailBg"><div class="sheet" id="detail"></div></div>
<div class="sheet-bg" id="notiBg"><div class="sheet" id="notiSheet"></div></div>
<datalist id="partsList"></datalist>
<datalist id="carrierList"></datalist>
<div id="pdfStage"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  /* ---------- CẤU HÌNH FIREBASE (đồng bộ nhiều máy khi chạy trên GitHub) ----------
     Dán cấu hình lấy từ Firebase Console vào đây, ví dụ:
     const FIREBASE_CONFIG = { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
     Để null = chỉ lưu trên máy. */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDU5bu12-GTgmmnHNekWZKkIH9X5nBLQl8",
    authDomain: "bao-hanh-9ca36.firebaseapp.com",
    projectId: "bao-hanh-9ca36",
    storageBucket: "bao-hanh-9ca36.firebasestorage.app",
    messagingSenderId: "108981216120",
    appId: "1:108981216120:web:b85c4ad4409826a3641e8d"
  };

  /* ---------- Bộ phận & mật mã (lưu dạng mã băm) ---------- */
  const SALT = "bh2026:";
  const ROLES = {
    bh: {name:"Bảo hành", icon:"🧾", hash:"c5329f777464ed051d1035380083d2de5d0ec477019e11b49c8da2db31dba77f"},
    gd: {name:"Giám đốc", icon:"👔", hash:"add91a0b16f18161cbfdb541afc919fd02be27543ff919cca2ac5fd1f44d76b5"},
    kt: {name:"Kỹ thuật", icon:"🔧", hash:"0fc3527e9b0bb475795e0ed5883e5da9a38082cdf2e3fdff843f5cafb9b19f3c"},
    vc: {name:"Vận chuyển", icon:"🚚", hash:"cf0189e746365fc75be81d4571d9ef049f508fdebdb8f98d7c6b0ac6c3dffddd"}
  };
  /* ---------- Các giai đoạn ---------- */
  const STAGES = {
    cho_gd:   {label:"Chờ giám đốc duyệt",            cls:"b-info", to:"gd"},
    cho_kt:   {label:"Chờ kỹ thuật xử lý",            cls:"b-warn", to:"kt"},
    dang_sua: {label:"Kỹ thuật đang xử lý",           cls:"b-warn", to:"kt"},
    xong:     {label:"Đã xử lý xong – chờ vận chuyển",     cls:"b-info", to:"vc"},
    tra_lai:  {label:"GĐ không duyệt – chờ vận chuyển trả",cls:"b-bad",  to:"vc"},
    da_giao:  {label:"Đã gửi trả khách",                   cls:"b-ok",   to:null},
    da_tra:   {label:"Đã trả khách",                       cls:"b-ok",   to:null}
  };
  const TYPE = {bh:"Bảo hành", sc:"Sửa chữa"};
  const ACTION = {sua:"Sửa chữa", thaymoi:"Thay mới"};
  const SHIP = {chanh:"Chành xe", buudien:"Bưu điện"};
  const WAIT_VC = ["xong","tra_lai"], CLOSED = ["da_giao","da_tra"];
  const LATE_DAYS = 3;   // tồn quá số ngày này -> cảnh báo đỏ

  async function sha(t){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
  }
  async function checkPw(role, pw){ try { return (await sha(SALT + pw.trim().toLowerCase())) === ROLES[role].hash; } catch(e){ return false; } }

  /* ---------- trạng thái ---------- */
  let role = null;
  try { const r = sessionStorage.getItem("bh_role"); if (ROLES[r]) role = r; } catch(e){}
  let reg = [], tickets = [], mode = "local", colReg = null, colTk = null;
  let prevStage = null;        // Map id -> stage, để phát hiện chuyển giai đoạn
  let recvType = null, ktFilter = "cho", pendingTab = null, actCtx = null, detailId = null;

  /* ---------- tiện ích ---------- */
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const fmt = s => { if(!s) return "—"; const [y,m,d] = s.slice(0,10).split("-"); return `${d}/${m}/${y}`; };
  const fmtTime = s => { if(!s) return ""; const d = new Date(s); return d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}) + " " + fmt(iso(d)); };
  const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
  const keySN = s => String(s||"").trim().toUpperCase().replace(/\s+/g,"");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const code = () => { const d = iso(new Date()).replace(/-/g,"").slice(2); return "PN" + d + "-" + Math.random().toString(36).slice(2,5).toUpperCase(); };
  const daysSince = s => Math.max(0, Math.round((today() - new Date(String(s).slice(0,10)+"T00:00:00")) / 86400000));
  const open = id => $("#"+id).classList.add("show");
  const close = id => $("#"+id).classList.remove("show");
  document.addEventListener("click", e => { const c = e.target.closest("[data-close]"); if (c) close(c.dataset.close); });
  document.querySelectorAll(".sheet-bg").forEach(bg => bg.addEventListener("click", e => { if (e.target === bg) close(bg.id); }));
  function toast(m){ const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 2400); }

  function addMonths(d, n){ const x = new Date(d), day = x.getDate(); x.setMonth(x.getMonth() + n); if (x.getDate() < day) x.setDate(0); return x; }
  function expiry(purchaseDate, months){ return addMonths(new Date(purchaseDate + "T00:00:00"), Number(months||12)); }
  function remain(purchaseDate, months){
    const exp = expiry(purchaseDate, months), now = today();
    const diff = Math.round((exp - now) / 86400000);
    if (diff < 0) return {ok:false, exp, text:`Đã hết hạn ${-diff} ngày`};
    let m = (exp.getFullYear()-now.getFullYear())*12 + exp.getMonth()-now.getMonth();
    if (addMonths(now, m) > exp) m--;
    const d = Math.round((exp - addMonths(now, m)) / 86400000);
    return {ok:true, exp, days:diff, text: (m > 0 ? `Còn ${m} tháng ${d} ngày` : `Còn ${d} ngày`)};
  }

  /* ---------- âm báo + rung ---------- */
  let actx = null;
  function beep(){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      [0, .18].forEach(t => { const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = 880; g.gain.setValueAtTime(.12, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + .15);
        o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .16); });
    } catch(e){}
    try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch(e){}
  }

  /* ================= THÔNG BÁO ================= */
  let bannerQ = [], bannerOn = false, bannerTarget = null, bannerCur = null;
  function notify(t){
    const st = STAGES[t.stage]; if (!st) return;
    const who = st.to ? `→ Bộ phận ${ROLES[st.to].name} cần xử lý` : "Hoàn tất";
    bannerQ = bannerQ.filter(b => b.id !== t.id);
    bannerQ.push({id: t.id, title:`${TYPE[t.type]} · ${t.product} (SN ${t.serial})`, text:`${st.label}. ${who}`, to: st.to});
    if (!bannerOn) nextBanner();
    else if (bannerCur === t.id) { clearTimeout(nextBanner._t); $("#banner").classList.remove("show"); setTimeout(nextBanner, 300); }
  }
  function nextBanner(){
    const b = bannerQ.shift(); if (!b){ bannerOn = false; bannerCur = null; return; }
    bannerOn = true; bannerTarget = b.to; bannerCur = b.id;
    $("#bnTitle").textContent = b.title; $("#bnText").textContent = b.text;
    $("#banner").classList.add("show"); beep();
    clearTimeout(nextBanner._t);
    nextBanner._t = setTimeout(() => { $("#banner").classList.remove("show"); setTimeout(nextBanner, 350); }, 4500);
  }
  $("#banner").onclick = () => {
    $("#banner").classList.remove("show"); clearTimeout(nextBanner._t); setTimeout(nextBanner, 350);
    if (bannerTarget && !$("#app").classList.contains("hide")) goTo(bannerTarget);
  };
  function events(){
    const ev = [];
    tickets.forEach(t => (t.history||[]).forEach(h => ev.push({t, h})));
    return ev.sort((a,b) => (b.h.at||"").localeCompare(a.h.at||"")).slice(0, 50);
  }
  function lastSeen(){ try { return localStorage.getItem("bh_seen") || ""; } catch(e){ return ""; } }
  function updateBell(){
    const s = lastSeen(), n = events().filter(e => e.h.at > s).length;
    $("#bellCnt").textContent = n > 99 ? "99+" : n; $("#bellCnt").classList.toggle("hide", !n);
  }
  $("#bell").onclick = () => {
    const s = lastSeen(), ev = events();
    $("#notiSheet").innerHTML = `<div class="grab"></div><h2>🔔 Thông báo</h2>` +
      (ev.length ? ev.map(({t,h}) => `<div class="noti ${h.at > s ? "new" : ""}" data-id="${esc(t.id)}">
        <b>${esc(t.product)} <span class="sub">SN ${esc(t.serial)}</span></b>
        <div><span class="badge ${STAGES[h.stage]?.cls||""}">${esc(STAGES[h.stage]?.label||h.stage)}</span></div>
        <div class="sub">${esc(h.by)} · ${fmtTime(h.at)}${h.note ? " · " + esc(h.note) : ""}</div></div>`).join("")
      : `<div class="empty">Chưa có thông báo.</div>`) +
      `<div class="btns"><button class="btn" data-close="notiBg">Đóng</button></div>`;
    $("#notiSheet").querySelectorAll(".noti").forEach(n => n.onclick = () => { close("notiBg"); showDetail(n.dataset.id); });
    try { localStorage.setItem("bh_seen", new Date().toISOString()); } catch(e){}
    updateBell(); open("notiBg");
  };

  /* ================= ĐĂNG NHẬP & CHUYỂN TAB ================= */
  let loginRole = "bh";
  document.querySelectorAll(".dept").forEach(b => b.onclick = () => {
    loginRole = b.dataset.role;
    document.querySelectorAll(".dept").forEach(x => x.classList.toggle("sel", x === b));
    $("#pwErr").textContent = ""; $("#pw").focus();
  });
  $("#loginForm").onsubmit = async e => {
    e.preventDefault();
    if (await checkPw(loginRole, $("#pw").value)) { $("#pw").value = ""; enter(loginRole); }
    else { $("#pwErr").textContent = "Sai mật mã. Vui lòng thử lại."; $("#pw").select(); }
  };
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => goTo(b.dataset.tab));
  function goTo(r, reason){
    if (r === role) { renderAll(); return; }
    pendingTab = r;
    $("#unlockTitle").textContent = `${ROLES[r].icon} Mật mã bộ phận ${ROLES[r].name}`;
    $("#unlockReason").textContent = reason || ""; $("#unlockReason").classList.toggle("hide", !reason);
    $("#pw2").value = ""; $("#pw2Err").textContent = "";
    open("unlockBg"); setTimeout(() => $("#pw2").focus(), 250);
  }
  $("#unlockForm").onsubmit = async e => {
    e.preventDefault();
    if (await checkPw(pendingTab, $("#pw2").value)) { close("unlockBg"); enter(pendingTab); }
    else { $("#pw2Err").textContent = "Sai mật mã."; $("#pw2").select(); }
  };
  $("#logout").onclick = () => {
    role = null; try { sessionStorage.removeItem("bh_role"); } catch(e){}
    document.querySelectorAll(".sheet-bg").forEach(b => b.classList.remove("show"));
    $("#app").classList.add("hide"); $("#login").classList.remove("hide");
  };
  function enter(r){
    role = r; try { sessionStorage.setItem("bh_role", r); } catch(e){}
    $("#login").classList.add("hide"); $("#app").classList.remove("hide");
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === r));
    ["bh","gd","kt","vc"].forEach(k => $("#v-"+k).classList.toggle("hide", k !== r));
    $("#appTitle").textContent = ROLES[r].icon + " " + ROLES[r].name;
    renderAll(); window.scrollTo(0,0);
  }

  /* ================= LƯU TRỮ ================= */
  function loadLocal(){
    try { reg = JSON.parse(localStorage.getItem("baohanh_v1") || "[]"); } catch(e){ reg = []; }
    try { tickets = JSON.parse(localStorage.getItem("baohanh_tk") || "[]"); } catch(e){ tickets = []; }
  }
  function saveLocal(){
    try { localStorage.setItem("baohanh_v1", JSON.stringify(reg)); localStorage.setItem("baohanh_tk", JSON.stringify(tickets)); } catch(e){}
  }
  function dbErr(e){
    toast(e && e.code === "quota_exceeded" ? "Bộ nhớ đã đầy, hãy xóa bớt dữ liệu cũ."
        : e && e.code === "invalid_argument" ? "Tài khoản của bạn chỉ có quyền xem." : "Lưu thất bại, thử lại sau.");
  }
  async function put(kind, obj){
    const clean = JSON.parse(JSON.stringify(obj)), id = clean.id; delete clean.id;
    if (mode === "cloud"){
      try { await (kind === "tk" ? colTk : colReg).doc(id).set(clean); } catch(e){ dbErr(e); throw e; }
    } else {
      const arr = kind === "tk" ? tickets : reg, i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr[i] = obj; else arr.push(obj);
      saveLocal();
      if (kind === "tk") onTickets(tickets.slice()); else renderAll();
    }
  }
  function onTickets(list){
    const first = prevStage === null, map = new Map();
    list.forEach(t => {
      map.set(t.id, t.stage);
      if (!first && prevStage.get(t.id) !== t.stage) notify(t);
    });
    prevStage = map; tickets = list;
    renderAll();
  }
  const setSync = (on, txt) => { $("#dot").classList.toggle("on", on); $("#syncTxt").textContent = txt; };

  async function initDb(){
    loadLocal(); onTickets(tickets.slice()); setSync(false, "Lưu trên máy");
    let db = null;
    if (window.claude && window.claude.use) { try { db = await window.claude.use("db"); } catch(e){} }
    // Firebase chỉ dùng khi chạy ngoài Claude (VD: GitHub Pages)
    if (!db && FIREBASE_CONFIG && !window.claude) db = await initFirebase();
    if (!db) return;
    colReg = db.collection("warranties"); colTk = db.collection("tickets");
    const timer = setTimeout(() => setSync(false, "Chưa kết nối"), 10000);
    let gotTk = false;
    colReg.onSnapshot(s => { mode = "cloud"; reg = s.docs.map(d => Object.assign({id:d.id}, d.data())); renderAll(); }, () => {});
    colTk.onSnapshot(s => {
      if (!s.metadata.fromCache) clearTimeout(timer);
      if (!gotTk) { prevStage = null; gotTk = true; }   // lần đầu: không bắn thông báo cũ
      mode = "cloud";
      setSync(true, s.metadata.fromCache ? "Đang đồng bộ" : "Đã đồng bộ");
      onTickets(s.docs.map(d => Object.assign({id:d.id}, d.data())));
    }, () => { clearTimeout(timer); setSync(false, "Mất kết nối"); });
  }

  function findReg(sn){ const k = keySN(sn); return k ? reg.find(r => keySN(r.serial) === k) : null; }
  function push(t, stage, note, extra){
    const c = JSON.parse(JSON.stringify(t));
    Object.assign(c, extra || {});
    c.stage = stage; c.updatedAt = new Date().toISOString();
    c.history = (c.history || []).concat([{stage, at: c.updatedAt, by: ROLES[role].name, note: note || ""}]);
    return c;
  }

  /* ================= RENDER CHUNG ================= */
  function renderAll(){
    updateBell();
    const n = {bh: 0,
               gd: tickets.filter(t => t.stage==="cho_gd").length,
               kt: tickets.filter(t => t.stage==="cho_kt"||t.stage==="dang_sua").length,
               vc: tickets.filter(t => WAIT_VC.includes(t.stage)).length};
    document.querySelectorAll(".tab").forEach(b => { const c = b.querySelector(".cnt"), v = n[b.dataset.tab]; c.textContent = v; c.classList.toggle("hide", !v); });
    if (!role) return;
    if (role === "bh") renderBH(); else if (role === "gd") renderGD(); else if (role === "vc") renderVC(); else renderKT();
    if (detailId && $("#detailBg").classList.contains("show")) showDetail(detailId);
  }
  const isLate = t => !CLOSED.includes(t.stage) && daysSince(t.createdAt) > LATE_DAYS;
  function tkCard(t, btns){
    const st = STAGES[t.stage] || {label:t.stage, cls:""};
    return `<div class="item ${isLate(t) ? "lateitem" : ""}" data-id="${esc(t.id)}">
      <div class="row"><div><div class="pname"><span class="tag ${t.type}">${TYPE[t.type]}</span>${esc(t.product)}</div>
        <div class="sub">SN ${esc(t.serial)} · ${esc(t.customer)}${t.phone ? " · " + esc(t.phone) : ""}</div></div>
        <span class="badge ${st.cls}">${esc(st.label)}</span></div>
      ${t.issue ? `<div style="margin-top:6px;font-size:14px">⚠️ ${esc(t.issue)}</div>` : ""}
      ${t.action ? `<div class="sub" style="margin-top:4px">🔧 ${ACTION[t.action]}${t.parts ? " · Linh kiện: " + esc(t.parts) : ""}</div>` : ""}
      ${t.ship ? `<div class="sub" style="margin-top:4px">🚚 ${shipText(t)} · trả ${fmt(t.ship.date)}</div>` : ""}
      <div class="sub" style="margin-top:4px">${esc(t.code)} · nhận ${fmt(t.createdAt)} ${isLate(t) ? `<b style="color:var(--bad)">(🚨 tồn ${daysSince(t.createdAt)} ngày)</b>` : `(${daysSince(t.createdAt)} ngày)`}</div>
      ${btns || ""}
    </div>`;
  }
  function bindCards(root){
    root.querySelectorAll(".item[data-id]").forEach(el => el.addEventListener("click", e => {
      if (e.target.closest("button")) return; showDetail(el.dataset.id);
    }));
  }
  function showDetail(id){
    const t = tickets.find(x => x.id === id); if (!t) return;
    detailId = id;
    const st = STAGES[t.stage] || {label:t.stage, cls:""};
    $("#detail").innerHTML = `<div class="grab"></div>
      <h2><span class="tag ${t.type}">${TYPE[t.type]}</span>${esc(t.product)}</h2>
      <span class="badge ${st.cls}">${esc(st.label)}</span>
      <dl class="kv" style="margin-top:12px">
        <dt>Mã phiếu</dt><dd>${esc(t.code)}</dd>
        <dt>Khách hàng</dt><dd>${esc(t.customer)}</dd>
        <dt>Điện thoại</dt><dd>${esc(t.phone)||"—"}</dd>
        <dt>Số seri</dt><dd>${esc(t.serial)}</dd>
        ${t.type==="bh" && t.purchaseDate ? `<dt>Bảo hành</dt><dd>Mua ${fmt(t.purchaseDate)}, ${t.months} tháng – lúc nhận: ${esc(t.warrantyText)}</dd>` : ""}
        <dt>Lỗi</dt><dd>${esc(t.issue)||"—"}</dd>
        ${t.action ? `<dt>Kỹ thuật</dt><dd>${ACTION[t.action]}</dd>` : ""}
        ${t.parts ? `<dt>Linh kiện thay</dt><dd>${esc(t.parts)}</dd>` : ""}
        ${t.tech ? `<dt>KTV</dt><dd>${esc(t.tech)}</dd>` : ""}
        ${t.techNote ? `<dt>Ghi chú KT</dt><dd>${esc(t.techNote)}</dd>` : ""}
        ${t.ship ? `<dt>Vận chuyển</dt><dd>${shipText(t)}</dd><dt>Ngày trả khách</dt><dd>${fmt(t.ship.date)}</dd>${t.ship.note ? `<dt>Ghi chú VC</dt><dd>${esc(t.ship.note)}</dd>` : ""}` : ""}
      </dl>
      <h3 style="font-size:15px;margin:10px 0 4px">Quá trình xử lý</h3>
      <div class="tl">${(t.history||[]).map(h => `<div><b>${esc(STAGES[h.stage]?.label||h.stage)}</b><br><span class="sub">${esc(h.by)} · ${fmtTime(h.at)}</span>${h.note ? `<br>${esc(h.note)}` : ""}</div>`).join("")}</div>
      <div class="btns">${t.ship ? `<button class="btn pri" id="dPdf">📄 Xuất PDF</button>` : ""}<button class="btn" data-close="detailBg">Đóng</button></div>`;
    if (t.ship) $("#dPdf").onclick = () => exportPdf(t);
    open("detailBg");
  }

  /* ================= BẢO HÀNH ================= */
  const F = $("#recvForm");
  function refreshRecv(){
    const sn = F.serial.value.trim(), r = findReg(sn);
    $("#typeWrap").classList.toggle("hide", !sn);
    $("#foundBox").innerHTML = r ? `<div class="found">✔ Seri đã có trong hệ thống: ${esc(r.product)} – ${esc(r.customer)}${r.purchaseDate ? `, mua ${fmt(r.purchaseDate)} (${r.months} tháng)` : ""}</div>` : "";
    document.querySelectorAll("#recvForm .opt").forEach(o => o.classList.toggle("sel", o.dataset.type === recvType));
    $("#bhWrap").classList.toggle("hide", recvType !== "bh");
    $("#issueWrap").classList.toggle("hide", !recvType);
    let canSend = !!recvType;
    if (recvType === "bh"){
      const hasBuy = r && r.purchaseDate;
      $("#buyFields").classList.toggle("hide", !!hasBuy);
      const pd = hasBuy ? r.purchaseDate : F.purchaseDate.value, mo = hasBuy ? r.months : F.months.value;
      if (!pd) { $("#wBox").innerHTML = `<div class="sub" style="margin-top:8px">Nhập ngày mua để tính thời hạn bảo hành.</div>`; canSend = false; }
      else {
        const w = remain(pd, mo), now = new Date();
        $("#wBox").innerHTML = `<div class="wbox ${w.ok ? "b-ok" : "b-bad"}"><b>${w.ok ? "🛡️ CÒN BẢO HÀNH" : "⛔ HẾT HẠN BẢO HÀNH"}</b>
          ${w.text} · hết hạn ${fmt(iso(w.exp))}<br><span style="font-size:12px;opacity:.8">Tính theo giờ hệ thống: ${now.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})} ${fmt(iso(now))}</span>
          ${w.ok ? "" : `<div style="margin-top:8px"><button type="button" class="btn sm danger" id="toSc">Chuyển sang Sửa chữa</button></div>`}</div>`;
        if (!w.ok) { canSend = false; $("#toSc").onclick = () => { recvType = "sc"; refreshRecv(); }; }
      }
      $("#recvBtn").textContent = "🔧 Chuyển kỹ thuật bảo hành";
    } else if (recvType === "sc") {
      $("#recvBtn").textContent = "👔 Gửi giám đốc duyệt";
    }
    $("#recvBtn").disabled = !canSend;
  }
  F.serial.addEventListener("input", () => {
    const r = findReg(F.serial.value);
    if (r) { if (!F.customer.value) F.customer.value = r.customer || ""; if (!F.product.value) F.product.value = r.product || ""; if (!F.phone.value) F.phone.value = r.phone || ""; }
    refreshRecv();
  });
  F.purchaseDate.addEventListener("input", refreshRecv); F.months.addEventListener("change", refreshRecv);
  document.querySelectorAll("#recvForm .opt").forEach(o => o.onclick = () => { recvType = o.dataset.type; refreshRecv(); });
  F.onsubmit = async e => {
    e.preventDefault();
    if (!recvType) return;
    const issue = F.issue.value.trim(); if (!issue) { toast("Hãy nhập mô tả lỗi"); F.issue.focus(); return; }
    const r = findReg(F.serial.value);
    const base = {customer:F.customer.value.trim(), phone:F.phone.value.trim(), product:F.product.value.trim(), serial:F.serial.value.trim()};
    let pd = "", mo = "";
    if (r && r.purchaseDate) { pd = r.purchaseDate; mo = r.months; }
    else if (F.purchaseDate.value) { pd = F.purchaseDate.value; mo = Number(F.months.value); }
    // cập nhật sổ sản phẩm theo seri
    const regRec = Object.assign({}, r || {id: uid(), createdAt: new Date().toISOString()}, base, pd ? {purchaseDate: pd, months: Number(mo)} : {}, {updatedAt: new Date().toISOString()});
    const t0 = Object.assign({id: uid(), code: code(), type: recvType, issue, createdAt: new Date().toISOString(), history: []}, base);
    if (recvType === "bh") { t0.purchaseDate = pd; t0.months = Number(mo); t0.warrantyText = remain(pd, mo).text; }
    const stage = recvType === "bh" ? "cho_kt" : "cho_gd";
    const t = push(t0, stage, recvType === "bh" ? `Còn bảo hành (${t0.warrantyText})` : "Khách yêu cầu sửa chữa");
    try { await put("reg", regRec); await put("tk", t); } catch(err){ return; }
    F.reset(); recvType = null; refreshRecv();
    if (stage === "cho_gd") { toast("Đã gửi giám đốc duyệt"); goTo("gd", `Có hàng sửa chữa mới: ${t.product} (SN ${t.serial}) cần giám đốc duyệt.`); }
    else { toast("Đã chuyển kỹ thuật"); goTo("kt", `Hàng bảo hành mới: ${t.product} (SN ${t.serial}) chờ kỹ thuật xử lý.`); }
  };

  function renderBH(){
    refreshRecv();
    const trk = tickets.filter(t => !CLOSED.includes(t.stage)).sort((a,b) => (a.createdAt||"").localeCompare(b.createdAt||""));
    $("#trackList").innerHTML = trk.length ? trk.map(t => tkCard(t)).join("") : `<div class="empty">Không có hàng đang xử lý.</div>`;
    const done = tickets.filter(t => CLOSED.includes(t.stage)).sort((a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||"")).slice(0,20);
    $("#doneList").innerHTML = done.length ? done.map(t => tkCard(t)).join("") : `<div class="empty">Chưa có.</div>`;
    ["#trackList","#doneList"].forEach(s => bindCards($(s)));
  }

  /* ---------- sheet hành động có ghi chú ---------- */
  function openAct(o){
    actCtx = o;
    $("#actForm").innerHTML = `<div class="grab"></div><h2>${esc(o.title)}</h2>
      <div style="margin-bottom:6px"><b>${esc(o.t.product)}</b> <span class="sub">SN ${esc(o.t.serial)} · ${esc(o.t.customer)}</span></div>
      ${o.t.issue ? `<div class="sub">Lỗi: ${esc(o.t.issue)}</div>` : ""}

    try { await navigator.clipboard.writeText(lines.join("\n")); toast("Đã sao chép – dán vào Excel/Google Sheets"); }

  /* ---------- Xuất PDF ---------- */
  const libs = {};
  function loadScript(src){
    return libs[src] || (libs[src] = new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => { delete libs[src]; no(new Error("load")); }; document.head.appendChild(s); }));
  }
  function pdfHtml(t){
    const rows = (pairs) => `<table>${pairs.filter(p => p[1]).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")}</table>`;

    return `<h1>PHIẾU GIAO TRẢ HÀNG ${t.type === "bh" ? "BẢO HÀNH" : "SỬA CHỮA"}</h1>

      <h2>Kết quả xử lý</h2>
      ${rows([["Tình trạng", t.action ? "Đã xử lý" : "Giám đốc không duyệt sửa – trả lại khách"],["Phương án", t.action ? ACTION[t.action] : ""],
        ["Linh kiện thay", esc(t.parts)],["Kỹ thuật viên", esc(t.tech)],["Ghi chú kỹ thuật", esc(t.techNote)]])}
      <h2>Vận chuyển trả khách</h2>
      ${rows([["Hình thức", SHIP[s.method] || ""],[s.method === "chanh" ? "Tên chành xe" : "Bưu cục", esc(s.carrier)],["SĐT chành xe", esc(s.carrierPhone)],
        ["Mã vận đơn", esc(s.tracking)],["Ngày trả lại khách", `<b>${fmt(s.date)}</b>`],["Ghi chú", esc(s.note)]])}
      <h2>Quá trình xử lý</h2>
      ${rows((t.history||[]).map(h => [fmtTime(h.at), `<b>${esc(STAGES[h.stage]?.label || h.stage)}</b> – ${esc(h.by)}${h.note ? "<br>" + esc(h.note) : ""}`]))}
      <div class="sig"><div><b>Bộ phận bảo hành</b><i>(Ký, ghi rõ họ tên)</i></div><div><b>Bên vận chuyển</b><i>(Ký, ghi rõ họ tên)</i></div><div><b>Khách hàng</b><i>(Ký, ghi rõ họ tên)</i></div></div>`;
  }
  let pdfBusy = false;
  async function exportPdf(t){
    if (!t || pdfBusy) return; pdfBusy = true;
    try {
      toast("Đang tạo PDF…");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
      const stage = $("#pdfStage"); stage.innerHTML = pdfHtml(t);
      const canvas = await window.html2canvas(stage, {scale: 2, backgroundColor: "#ffffff"});
      stage.innerHTML = "";
      const pdf = new window.jspdf.jsPDF({unit: "mm", format: "a4"});
      const W = 210, H = 297, imgH = canvas.height * W / canvas.width;
      const img = canvas.toDataURL("image/jpeg", 0.92);
      let y = 0; pdf.addImage(img, "JPEG", 0, 0, W, imgH);
      while (imgH + y > H + 1) { y -= H; pdf.addPage(); pdf.addImage(img, "JPEG", 0, y, W, imgH); }
      const blob = pdf.output("blob"), name = `Phieu-giao-tra_${t.code}_${keySN(t.serial)}.pdf`;
      let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
      if (dl) {
        try { await dl.save({filename: name, data: blob}); toast("Đã lưu file PDF"); }
        catch(e){ toast(e && e.code === "declined" ? "Đã hủy tải file" : "Không tải được file ở đây"); }
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast("Đã tạo file PDF");
      }
    } catch(e){ toast("Không tạo được PDF, kiểm tra mạng và thử lại"); }
    finally { pdfBusy = false; }
  }

  /* ---------- Firebase ---------- */
  async function initFirebase(){
    try {
      setSync(false, "Đang kết nối…");
      const v = "https://www.gstatic.com/firebasejs/10.12.2/";
      await loadScript(v + "firebase-app-compat.js");
      await loadScript(v + "firebase-auth-compat.js");
      await loadScript(v + "firebase-firestore-compat.js");
      const app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(FIREBASE_CONFIG);
      await window.firebase.auth(app).signInAnonymously();
      const fs = window.firebase.firestore(app);
      return { collection: p => fs.collection(p) };
    } catch(e){
      console.warn("Firebase:", e && e.message);
      setSync(false, "Lỗi kết nối Firebase – lưu trên máy");
      toast("Không kết nối được máy chủ, dữ liệu tạm lưu trên máy");
      return null;
    }
  }

  /* ---------- khởi động ---------- */
  initDb();
  if (role) enter(role);
})();
</script>
