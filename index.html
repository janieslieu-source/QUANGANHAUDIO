<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phiếu bảo hành & sửa chữa</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceee8;--card:#fff;--ink:#16211f;--mut:#5d6b67;--line:#d5dbd4;--pri:#0f4c4a;--onpri:#fff;--warn:#b45309;--ok:#1d7a46;--bad:#b3261e;--chip:#e3e8e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111917;--card:#1a2522;--ink:#e8eeeb;--mut:#9aaaa5;--line:#2c3935;--pri:#5fc2b8;--onpri:#08201d;--warn:#f0a94a;--ok:#5fd08a;--bad:#ff8a80;--chip:#23302c}}
:root[data-theme="dark"]{--bg:#111917;--card:#1a2522;--ink:#e8eeeb;--mut:#9aaaa5;--line:#2c3935;--pri:#5fc2b8;--onpri:#08201d;--warn:#f0a94a;--ok:#5fd08a;--bad:#ff8a80;--chip:#23302c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Be Vietnam Pro",system-ui,sans-serif;max-width:560px;margin-inline:auto;min-height:100vh;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header{background:var(--pri);color:var(--onpri);padding:18px 16px 14px}
h1{font-size:20px;font-weight:800;margin:0 0 12px}
.stats{display:flex;gap:8px}
.stat{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;opacity:.9}
main{padding:12px 14px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:0}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:500 13px inherit;font-family:inherit;padding:7px 12px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--onpri);font-weight:700}
.t{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--mut));border-radius:10px;padding:11px 12px;margin-top:10px;color:inherit;font:inherit}
.t .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.t b{font-weight:700}
.t small,.mut{color:var(--mut);font-size:13px}
.st{font-size:12px;font-weight:700;color:var(--c)}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:500 12px inherit;font-family:inherit;padding:10px 0 9px}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav button[aria-current=page]{color:var(--pri);font-weight:700}
.btn{border:0;background:var(--pri);color:var(--onpri);font:700 15px inherit;font-family:inherit;padding:13px 16px;border-radius:10px;width:100%;margin-top:14px}
.btn.sec{background:var(--chip);color:var(--ink)}.btn.del{background:none;color:var(--bad);border:1.5px solid var(--bad)}
.row{display:flex;gap:8px}.row>*{flex:1}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.res{border-radius:10px;padding:14px;margin-top:14px;font-weight:700;border:2px solid var(--c);color:var(--c)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet.on{display:block}
.sheet>div{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.log{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}
.x{float:right;border:0;background:var(--chip);color:var(--ink);border-radius:99px;width:34px;height:34px;font-size:18px}
.snd{float:right;border:0;background:rgba(255,255,255,.18);color:var(--onpri);font:700 13px inherit;font-family:inherit;padding:7px 11px;border-radius:99px}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;position:relative}.seg input{position:absolute;opacity:0;width:1px;height:1px}.seg span{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}.seg input:checked+span{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.seg input:focus-visible+span{outline:3px solid var(--warn);outline-offset:2px}
.sync{font-size:12px;opacity:.9;margin-top:8px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:0 0 10px}.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 13px inherit;font-family:inherit;padding:10px 2px;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs button[aria-selected=true]{color:var(--pri);border-bottom-color:var(--pri);font-weight:800}.tabs i{font-style:normal;background:var(--chip);border-radius:99px;padding:1px 8px;font-size:12px;margin-left:4px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;max-width:536px;margin:auto;background:#1d7a46;color:#fff;padding:14px;border-radius:12px;font-weight:700;z-index:40;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
.dept{display:flex;gap:6px;padding:10px 14px 0;max-width:560px;margin:0 auto}.dept button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 13px/1.2 inherit;font-family:inherit;padding:11px 4px;border-radius:10px}.dept button[aria-selected=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
</style>
</head>
<body>
<header><button id="snd" class="snd" type="button"></button><h1>Bảo hành &amp; sửa chữa</h1><div class="stats" id="stats"></div><div class="sync" id="sync" role="status"></div></header>
<div class="dept" id="dept" role="tablist" aria-label="Bộ phận"></div>
<main id="app"></main>
<nav>
<button data-v="list" aria-current="page"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Phiếu</button>
<button data-v="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tạo phiếu</button>
<button data-v="chk"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Tra cứu BH</button>
</nav>
<div class="login" id="login"></div>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet"><div id="sbody"></div></div>
<script>
const ST=[["Tiếp nhận","#6b7280"],["Đang kiểm tra","#0369a1"],["Chờ linh kiện","#b45309"],["Đang sửa","#7c3aed"],["Hoàn tất","#1d7a46"],["Đã trả hàng","#475569"],["Đã duyệt, chờ trả","#b45309"]];
let D=[],view="list",flt=-1,q="";
const KEY="bh_tickets_v1";
let GR=["Nhóm điện","Nhóm âm thanh","Nhóm điện lạnh","Nhóm khác"],gf="";
try{const g=JSON.parse(localStorage.getItem("bh_groups")||"null");if(g&&g.length)GR=g}catch(e){}
let tab="Hàng bảo hành";const typeOf=x=>x.type||(warr(x.buy,x.mo).ok?"Hàng bảo hành":"Hàng sửa chữa");
const HOLD=5,DAY=864e5;let ovf=false,tT;
const dueAt=x=>new Date(new Date(x.hold||x.at).getTime()+HOLD*DAY);
const PEND=3;
const isPend=x=>(x.conf=="Chờ duyệt"||x.conf=="Chờ xác nhận")&&x.s!=5;
const pendDays=x=>Math.floor((Date.now()-new Date(x.at).getTime())/DAY);
const pendOver=x=>isPend(x)&&new Date(x.at).getTime()+PEND*DAY<Date.now();
const cnt=n=>isKT()?D.filter(x=>n=="Đã chẩn đoán"?!!x.dlock:!x.dlock).length:D.filter(x=>n=="Đang treo"?isPend(x):typeOf(x)==n&&!isPend(x)).length;
const isOver=x=>x.conf!="Trả lại khách"&&x.s!=5&&!isPend(x)&&dueAt(x)<new Date();
const holdTxt=x=>{if(isPend(x))return pendOver(x)?" · ⚠ treo quá "+PEND+" ngày":" · chờ duyệt "+pendDays(x)+" ngày";if(x.conf=="Trả lại khách"||x.s==5)return"";if(isOver(x))return" · ⚠ quá hạn";if(x.s==6)return" · còn "+Math.ceil((dueAt(x)-new Date())/DAY)+" ngày";return""};
const toast=(t,bg)=>{const e=document.querySelector("#toast");e.textContent=t;e.style.background=bg||"#1d7a46";e.style.display="block";clearTimeout(tT);tT=setTimeout(()=>e.style.display="none",10000)};
const done=x=>{say("Đã sửa xong "+x.name);toast("✅ Đã sửa xong: "+x.name+" — "+x.dev)};
const overBanner=()=>{const o=D.filter(isOver);return o.length?`<button class="t" style="--c:#b45309;margin:0 0 10px" id="ov"><b>⏰ ${o.length} hàng quá ${HOLD} ngày chưa trả khách</b><br><small>${o.slice(0,3).map(x=>esc(x.name)).join(", ")}${o.length>3?"…":""} — chạm để ${ovf?"xem tất cả":"chỉ xem các phiếu này"}</small></button>`:""};
const pendBanner=()=>{const o=D.filter(pendOver);return o.length?`<button class="t" data-tab="Đang treo" style="--c:#b3261e;margin:0 0 10px"><b>⏳ ${o.length} hàng đang treo quá ${PEND} ngày chưa có lệnh duyệt</b><br><small>${o.slice(0,3).map(x=>esc(x.name)).join(", ")}${o.length>3?"…":""} — chạm để xem danh sách</small></button>`:""};
const pendCheck=()=>{if(!isGD())return;const o=D.filter(pendOver);if(!o.length)return;const day=new Date().toISOString().slice(0,10)+":"+o.length;let l="";try{l=localStorage.getItem("bh_rem2")||""}catch(e){}if(l==day)return;try{localStorage.setItem("bh_rem2",day)}catch(e){}
 toast("⏳ "+o.length+" hàng đang treo quá "+PEND+" ngày chưa có lệnh duyệt","#b3261e");say("Có "+o.length+" hàng đang treo quá "+PEND+" ngày chưa có lệnh duyệt")};
const remindCheck=()=>{if(!role||isKT())return;const o=D.filter(isOver);if(!o.length)return;const day=new Date().toISOString().slice(0,10)+":"+o.length;let l="";try{l=localStorage.getItem("bh_rem")||""}catch(e){}if(l==day)return;try{localStorage.setItem("bh_rem",day)}catch(e){}
 toast("⏰ Nhắc nhở: "+o.length+" hàng quá "+HOLD+" ngày chưa trả khách","#b45309");say("Nhắc nhở: có "+o.length+" hàng chưa trả khách")};
const ROLES=["Tiếp nhận","Kỹ thuật","Giám đốc"];
let role="";try{role=sessionStorage.getItem("bh_role")||""}catch(e){}
const isTN=()=>role=="Tiếp nhận",isKT=()=>role=="Kỹ thuật",isGD=()=>role=="Giám đốc";
const PK={"Tiếp nhận":"bh_pin_tn","Kỹ thuật":"bh_pin_kt","Giám đốc":"bh_pin"};
const rolePin=r=>{try{return localStorage.getItem(PK[r])||""}catch(e){return""}};
const setRolePin=(r,v)=>{try{localStorage.setItem(PK[r],v)}catch(e){}};
const KT_TABS=["Chờ chẩn đoán","Đã chẩn đoán"];
const tabNames=()=>isKT()?KT_TABS:["Hàng bảo hành","Hàng sửa chữa","Đang treo"];
const tabOk=x=>isKT()?(tab=="Đã chẩn đoán"?!!x.dlock:!x.dlock):(ovf?isOver(x):(tab=="Đang treo"?isPend(x):((tab==""||typeOf(x)==tab)&&!isPend(x))));
let tnOk=false;
const ttPass=()=>rolePin("Tiếp nhận")||"TT";
const gdPass=()=>rolePin("Giám đốc")||"VICKY";
const ktPass=()=>rolePin("Kỹ thuật")||"KT";
function lockView(){stats();document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current","false"));
 $("#app").innerHTML=`<div class="box"><b>Tiếp nhận thông tin</b><p class="mut" style="margin:6px 0 0">Gõ mã mật khẩu để nhập thông tin sản phẩm.</p><input id="tt" type="password" autocomplete="off" placeholder="Mã mật khẩu" style="margin-top:10px"><p id="terr" class="mut" role="alert" style="color:var(--bad);margin:6px 0 0"></p><button class="btn" id="ttgo">Vào</button></div>`;
 const go=()=>{if($("#tt").value.trim().toUpperCase()!==ttPass().toUpperCase()){$("#terr").textContent="Mã mật khẩu sai.";return}tnOk=true;view="new";render()};
 $("#ttgo").onclick=go;$("#tt").onkeydown=e=>{if(e.key=="Enter")go()}}
const DEPT=[["Tiếp nhận","Tiếp nhận thông tin"],["Giám đốc","Duyệt sửa"],["Kỹ thuật","Kỹ thuật"]];
function drawDept(){$("#dept").innerHTML=DEPT.map(([r,l])=>`<button role="tab" aria-selected="${role==r}" data-r="${r}">${l}</button>`).join("")}
function applyRole(){try{sessionStorage.setItem("bh_role",role)}catch(e){}
 $("#login").style.display="none";drawDept();
 document.querySelector('nav button[data-v="new"]').style.display=isTN()?"":"none";
 tab=isKT()?"Chờ chẩn đoán":isGD()?"Đang treo":"Hàng bảo hành";
 if(!isTN()&&view=="new")view="list";ovf=false;render()}
function gotoRole(r){if(r==role)return;if(r=="Giám đốc"||r=="Kỹ thuật"){askPin(r);return}if(r=="Tiếp nhận")tnOk=false;role=r;applyRole();setTimeout(pendCheck,800);setTimeout(remindCheck,12000)}
function askPin(r){const E=$("#login");E.style.display="block";
 E.innerHTML=`<div style="max-width:520px;margin:0 auto"><h1 style="font-size:20px;color:var(--pri);margin:0 0 6px">${r=="Giám đốc"?"Duyệt sửa":"Kỹ thuật"}</h1><p class="mut">Nhập mã để vào tab này.</p><input id="lp" type="password" inputmode="numeric" autocomplete="off"><p id="lerr" class="mut" role="alert" style="color:var(--bad)"></p><button class="btn" id="lgo">Vào</button><button class="btn sec" id="lcx">Hủy</button></div>`;
 $("#lgo").onclick=()=>{if($("#lp").value.trim().toUpperCase()!==(r=="Giám đốc"?gdPass():ktPass()).toUpperCase()){$("#lerr").textContent="Mã sai.";return}role=r;applyRole();setTimeout(pendCheck,800);setTimeout(remindCheck,12000)};
 $("#lcx").onclick=()=>{E.style.display="none"};$("#lp").onkeydown=e=>{if(e.key=="Enter")$("#lgo").click()};$("#lp").focus()}
const getPin=()=>{try{return localStorage.getItem("bh_pin")||""}catch(e){return""}};
const setPin=v=>{try{localStorage.setItem("bh_pin",v)}catch(e){}};
const saveGR=()=>{try{localStorage.setItem("bh_groups",JSON.stringify(GR))}catch(e){}};
const grList=id=>`<datalist id="${id}">${GR.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>`;
try{D=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){D=[]}
let DB=null,last={};
const setSync=t=>{const s=document.querySelector('#sync');if(s)s.textContent=t};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
 if(!DB)return;const cur={};
 D.forEach(x=>{cur[x.id]=JSON.stringify(x);if(last[x.id]!==cur[x.id])DB.collection('tickets').doc(x.id).set(x).catch(()=>setSync('Lưu thất bại — tài khoản cần quyền chỉnh sửa'))});
 Object.keys(last).forEach(id=>{if(!cur[id])DB.collection('tickets').doc(id).delete().catch(()=>{})});last=cur};
const $=s=>document.querySelector(s);
let mute=false;try{mute=localStorage.getItem('bh_mute')=='1'}catch(e){}
let AC=null;
function chime(){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 [[880,0],[1175,.28],[1568,.56],[1175,1.0],[1568,1.28]].forEach(([f,t])=>{[1,2.76].forEach((m,k)=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;
  o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(k?.12:.4,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+1.1);
  o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+1.2)})});
 if(navigator.vibrate)navigator.vibrate([120,60,120])}catch(e){}}
function say(t){if(mute)return;try{if(!window.speechSynthesis){chime();return}
 const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.95;u.volume=1;
 const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));if(v)u.voice=v;
 speechSynthesis.cancel();speechSynthesis.speak(u);if(navigator.vibrate)navigator.vibrate([120,60,120])}catch(e){chime()}}
function alertFor(c){if(c=='Trả lại khách')say('Trả lại khách');else chime()}
addEventListener('pointerdown',()=>{try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true});
function sndLbl(){$('#snd').textContent=mute?'🔕 Chuông tắt':'🔔 Chuông bật';$('#snd').setAttribute('aria-pressed',!mute)}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>(+n||0).toLocaleString("vi-VN")+"đ";
const fd=d=>d?new Date(d).toLocaleDateString("vi-VN"):"—";
function warr(buy,mo){if(!buy)return{t:mo==="end"?"Chưa nhập ngày kết thúc bảo hành":"Chưa có ngày mua",c:"var(--mut)"};const e=new Date(buy);if(mo==="end")e.setHours(23,59,59);else e.setMonth(e.getMonth()+(+mo||12));const days=Math.ceil((e-new Date())/864e5);
 return days>=0?{t:"Còn bảo hành đến "+fd(e)+" (còn "+days+" ngày)",c:"var(--ok)",ok:1}:{t:"Hết bảo hành từ "+fd(e)+" — tính phí sửa",c:"var(--bad)"}}
function stats(){if(isKT()){const a=D.filter(x=>!x.dlock).length;$("#stats").innerHTML=`<div class="stat"><b>${D.length}</b><span>Tổng phiếu</span></div><div class="stat"><b>${a}</b><span>Chờ chẩn đoán</span></div><div class="stat"><b>${D.length-a}</b><span>Đã chẩn đoán</span></div>`;return}const o=D.filter(x=>x.s!=4&&x.s!=5).length,r=D.filter(x=>x.s==4).length;
 $("#stats").innerHTML=`<div class="stat"><b>${D.length}</b><span>Tổng phiếu</span></div><div class="stat"><b>${o}</b><span>Đang xử lý</span></div><div class="stat"><b>${r}</b><span>Chờ trả hàng</span></div>`}
function render(){
 if(isTN()&&!tnOk){lockView();return}
 document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v==view?"page":"false"));
 stats();
 if(view=="list"){
  const L=D.filter(x=>(flt<0||x.s==flt)&&tabOk(x)&&(!q||(x.name+x.phone+x.dev+x.sn+x.id+(x.grp||"")).toLowerCase().includes(q.toLowerCase())));
  $("#app").innerHTML=`${(isGD()&&!rolePin("Giám đốc"))?`<div class="box" style="border-color:#b45309;margin:0 0 10px"><b>Đang dùng mật khẩu mặc định</b><div class="mut">Nên đổi: mở <b>Tra cứu BH</b>, kéo xuống khung <b>Mã vào các tab</b>.</div></div>`:""}${isGD()?pendBanner():""}${isKT()?"":overBanner()}<div class="tabs" role="tablist">${tabNames().map(n=>`<button role="tab" aria-selected="${tab==n}" data-tab="${n}">${n}<i>${cnt(n)}</i></button>`).join("")}</div><input id="q" type="search" placeholder="Tìm tên, SĐT, thiết bị, serial…" value="${esc(q)}" aria-label="Tìm phiếu">
  <div class="chips"><button class="chip" aria-pressed="${flt<0}" data-f="-1">Tất cả</button>${ST.map((s,i)=>`<button class="chip" aria-pressed="${flt==i}" data-f="${i}">${s[0]}</button>`).join("")}</div>

 const tm=setTimeout(()=>setSync('Chưa kết nối được máy chủ, đang hiển thị dữ liệu trên máy'),10000);
 DB.collection('tickets').onSnapshot(snap=>{
  const m=new Map(D.map(x=>[x.id,x]));
  D=snap.docs.map(d=>d.data()).map(v=>{const o=m.get(v.id);return o?Object.assign(o,v):v}).sort((a,b)=>a.at<b.at?1:-1);
  last={};D.forEach(x=>last[x.id]=JSON.stringify(x));

  D.forEach(x=>seen.add(x.id));
  if(ready&&!snap.metadata.hasPendingWrites&&fc.length){alertFor(fc[0].conf);setSync('🔔 Có phiếu mới: '+(fc[0].conf||'Xác nhận sửa')+' — '+fc[0].dev);setTimeout(()=>setSync('Dùng chung · cập nhật trực tiếp'),15000)}
  else if(!snap.metadata.fromCache&&!ready)setSync('Dùng chung · cập nhật trực tiếp');
  if(!snap.metadata.fromCache){clearTimeout(tm);
   if(!ready){ready=true;try{if(!localStorage.getItem('bh_mig')){L.filter(x=>!seen.has(x.id)).forEach(x=>DB.collection('tickets').doc(x.id).set(x).catch(()=>{}));localStorage.setItem('bh_mig','1')}}catch(e){}}}
