<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn Từ Mỗi Ngày – Tiếng Anh &amp; Tiếng Pháp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFDF7;--ink:#2B2D42;--muted:#6B6F80;--line:#E8E3D8;--line2:#D9D2C3;
  --g:#1F9D3A;--gd:#167A2C;--gs:#E4F7E7;
  --r:#E5484D;--rd:#B8343A;--rs:#FDE8E8;
  --b:#1A8FD8;--bd:#136CA6;--bs:#E3F2FC;
  --y:#FFC233;--yd:#D99B0B;--ys:#FFF5D9;
  --o:#FF7A3D;
}
html{font-size:21px}
html.big{font-size:25px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;font-weight:700}
button{font:inherit;cursor:pointer;border:none;color:inherit;-webkit-tap-highlight-color:transparent;background:none}
:focus-visible{outline:4px solid var(--b);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}

/* ---- nút nổi khối ---- */
.btn{--c:var(--g);--cd:var(--gd);display:flex;align-items:center;justify-content:center;gap:.45em;width:100%;min-height:3.2rem;padding:.6rem 1.2rem;border-radius:18px;background:var(--c);color:#fff;font-weight:900;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 0 var(--cd);transition:transform .06s,box-shadow .06s;margin-bottom:5px}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--cd)}
.btn.blue{--c:var(--b);--cd:var(--bd)}
.btn.red{--c:var(--r);--cd:var(--rd)}
.btn.white{background:#fff;color:var(--b);box-shadow:0 5px 0 var(--line2);border:2.5px solid var(--line2)}
.btn.plain{background:#fff;color:var(--muted);box-shadow:0 5px 0 var(--line2);border:2.5px solid var(--line2);text-transform:none;letter-spacing:0}
.btn:disabled{background:#E5E2DB;color:#A9A598;box-shadow:0 5px 0 #CFCBC1;cursor:default}
.btn.sm{min-height:2.7rem;width:auto;padding:.3rem .9rem;font-size:.95rem;text-transform:none;letter-spacing:0}
.spk{display:inline-grid;place-items:center;width:3.4rem;height:3.4rem;border-radius:18px;background:var(--b);color:#fff;font-size:1.5rem;box-shadow:0 5px 0 var(--bd);flex:none;margin-bottom:5px}
.spk.slow{background:#fff;color:var(--b);border:2.5px solid var(--line2);box-shadow:0 5px 0 var(--line2)}
.spk:active{transform:translateY(5px);box-shadow:none}
.spk.big{width:5rem;height:5rem;font-size:2.2rem;border-radius:24px}

/* ---- thanh trên ---- */
.bar-top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line);margin-bottom:10px}
.chip{white-space:nowrap;display:flex;align-items:center;gap:6px;padding:.35rem .8rem;border-radius:14px;font-weight:900;font-size:1rem;border:2.5px solid var(--line);background:#fff;min-height:2.7rem}
.chip.lang{color:var(--b)}
.flag{display:inline-block;width:1.7rem;height:1.15rem;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(0,0,0,.12)}
.flag.fr{background:linear-gradient(90deg,#1D4FB8 33.3%,#fff 33.3% 66.6%,#E5323B 66.6%)}
.flag.en{background:
  linear-gradient(90deg,transparent 42%,#C8102E 42% 58%,transparent 58%),
  linear-gradient(0deg,transparent 38%,#C8102E 38% 62%,transparent 62%),
  linear-gradient(90deg,transparent 36%,#fff 36% 64%,transparent 64%),
  linear-gradient(0deg,transparent 30%,#fff 30% 70%,transparent 70%),#012169}
.sp{flex:1}
.streak{color:var(--o)}.xp{color:var(--yd)}

/* ---- linh vật ---- */
.hello{display:flex;align-items:flex-end;gap:12px;margin:14px 0 6px}
.mascot{font-size:3.6rem;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.bubble{position:relative;background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:12px 16px;font-size:1.05rem}
.bubble:before{content:"";position:absolute;left:-11px;bottom:16px;width:18px;height:18px;background:#fff;border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.bubble small{display:block;color:var(--muted);font-weight:700;font-size:.85rem}

/* ---- lộ trình ---- */
.unit{background:var(--g);color:#fff;border-radius:20px;padding:14px 18px;margin:18px 0 8px;box-shadow:0 5px 0 var(--gd)}
.unit b{font-size:1.15rem;font-weight:900;display:block}
.unit span{opacity:.95;font-size:.95rem}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 10px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:9rem;text-align:center}
.node .dot{--c:#888;--cd:#666;width:5.2rem;height:5.2rem;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--cd),0 0 0 6px #fff,0 0 0 9px var(--ring,var(--line));display:grid;place-items:center;font-size:2.3rem;transition:transform .06s,box-shadow .06s}
.node:active .dot{transform:translateY(7px);box-shadow:0 0 0 var(--cd),0 0 0 6px #fff,0 0 0 9px var(--ring,var(--line))}
.node .nm{font-weight:900;font-size:1rem;margin-top:10px;line-height:1.2}
.node .st{font-size:1rem;letter-spacing:2px;color:#D8D2C5;height:1.3rem}
.node .st b{color:var(--y);font-weight:900}
.node.trophy .dot{--c:var(--y);--cd:var(--yd)}

/* ---- thanh dưới ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2.5px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav .in{display:flex;gap:8px;max-width:720px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:16px;border:2.5px solid transparent;font-weight:900;font-size:.85rem;color:var(--muted)}
.nav button i{font-style:normal;font-size:1.6rem}
.nav button.on{border-color:#9BD3F5;background:var(--bs);color:var(--b)}

/* ---- bảng chọn chủ đề ---- */
.shade{position:fixed;inset:0;z-index:20;background:rgba(30,30,40,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .hd{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sheet .ic{width:4rem;height:4rem;border-radius:20px;display:grid;place-items:center;font-size:2rem;flex:none}
.sheet h3{margin:0;font-size:1.35rem;font-weight:900}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;border:2.5px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);margin-bottom:12px}
.act:active{transform:translateY(5px);box-shadow:none}
.act .e{font-size:1.8rem;width:3rem;height:3rem;display:grid;place-items:center;border-radius:14px;flex:none}
.act b{display:block;font-size:1.1rem;font-weight:900}
.act span{color:var(--muted);font-size:.88rem}
.act .best{margin-left:auto;font-weight:900;color:var(--g);white-space:nowrap}

/* ---- màn bài học ---- */
.lesson-top{display:flex;align-items:center;gap:14px;padding:16px 0 8px}
.x{font-size:1.6rem;color:#A9A598;width:2.8rem;height:2.8rem;border-radius:14px;display:grid;place-items:center;flex:none}
.pbar{flex:1;height:1.15rem;background:#ECE8DF;border-radius:20px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--g);border-radius:20px;position:relative;transition:width .35s}
.pbar i:after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.count{font-weight:900;color:var(--muted);font-size:.95rem;flex:none}
.q-title{font-size:1.45rem;font-weight:900;margin:14px 0 14px;line-height:1.25}
.word-card{display:flex;align-items:center;gap:16px;background:#fff;border:2.5px solid var(--line);border-radius:24px;padding:18px;margin-bottom:16px}
.word-card .w{font-size:2.3rem;font-weight:900;color:var(--ink);line-height:1.15;word-break:break-word}
.flash{position:relative;background:#fff;border:2.5px solid var(--line);border-bottom-width:7px;border-radius:28px;padding:30px 20px 24px;text-align:center;margin:8px 0 18px}
.flash .tag{display:inline-block;padding:.25rem .8rem;border-radius:12px;font-size:.85rem;font-weight:900;margin-bottom:12px}
.flash .w{font-size:2.8rem;font-weight:900;line-height:1.15;word-break:break-word}
.flash .m{font-size:1.35rem;color:var(--muted);margin-top:8px}
.flash .ctl{display:flex;gap:14px;justify-content:center;margin-top:18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:.8rem 1rem;min-height:3.6rem;border-radius:18px;border:2.5px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);font-size:1.2rem;font-weight:800;margin-bottom:5px}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:none}
.opt .k{flex:none;width:2.1rem;height:2.1rem;border-radius:10px;border:2.5px solid var(--line);display:grid;place-items:center;font-size:.9rem;color:var(--muted)}
.opt.sel{border-color:#7CC4F2;background:var(--bs);box-shadow:0 5px 0 #7CC4F2;color:var(--bd)}
.opt.sel .k{border-color:#7CC4F2;color:var(--b)}
.opt.right{border-color:#8ED69B;background:var(--gs);box-shadow:0 5px 0 #8ED69B;color:var(--gd)}
.opt.right .k{background:var(--g);border-color:var(--g);color:#fff}
.opt.wrong{border-color:#F2A3A5;background:var(--rs);box-shadow:0 5px 0 #F2A3A5;color:var(--rd)}
.opt.wrong .k{background:var(--r);border-color:var(--r);color:#fff}
.hint-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.vi-box{flex:1;background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:14px 16px;font-size:1.25rem}
.lines{min-height:6.4rem;padding:8px 2px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 3.55rem,var(--line) 3.55rem calc(3.55rem + 2.5px));margin-bottom:22px}
.lines .ph{color:#B6AF9F;padding:12px 4px;font-size:1rem}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{padding:.5rem .95rem;min-height:3.1rem;border-radius:16px;border:2.5px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);font-size:1.2rem;font-weight:800;white-space:nowrap;margin-bottom:4px}
.tile:active{transform:translateY(4px);box-shadow:none}
.slot{border-radius:16px;background:#ECE8DF;display:inline-block}
.slot .tile.used{visibility:hidden}

/* ---- chân trang bài học ---- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:2.5px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.foot .in{max-width:720px;margin:0 auto}
.foot.ok{background:var(--gs);border-top-color:#BDE8C5}
.foot.bad{background:var(--rs);border-top-color:#F6C6C7}
.fb{display:flex;align-items:center;gap:12px;margin-bottom:14px;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.fb .badge{width:3rem;height:3rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.6rem;flex:none}
.fb b{display:block;font-size:1.3rem;font-weight:900}
.fb span{font-size:1.05rem;color:var(--ink)}
.foot.ok .fb b{color:var(--gd)}.foot.bad .fb b{color:var(--rd)}
.row2{display:flex;gap:12px}
.row2 .btn{flex:1}

/* ---- kết quả ---- */
.res{text-align:center;padding-top:26px}
.res h1{font-size:1.9rem;font-weight:900;margin:8px 0 4px;color:var(--yd)}
.ring{position:relative;width:12rem;height:12rem;margin:10px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .v b{font-size:3.1rem;font-weight:900;line-height:1}
.ring .v span{color:var(--muted);font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{border-radius:18px;border:2.5px solid;overflow:hidden;background:#fff}
.stat .h{color:#fff;font-size:.8rem;font-weight:900;padding:4px;text-transform:uppercase;letter-spacing:.04em}
.stat .n{font-size:1.4rem;font-weight:900;padding:8px 4px}
.card{background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:6px 16px;text-align:left}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid #F1ECE2}
.li:last-child{border-bottom:none}
.li .t{flex:1}.li .t b{display:block;font-size:1.1rem;font-weight:900}.li .t span{color:var(--muted);font-size:.92rem}
.li .spk{width:2.8rem;height:2.8rem;font-size:1.2rem;border-radius:14px;box-shadow:0 4px 0 var(--bd);margin-bottom:4px}
.li .spk.slow{box-shadow:0 4px 0 var(--line2)}
h2.h{font-size:1.2rem;font-weight:900;margin:22px 0 10px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.mascot,.confetti{animation:none;display:none}}

/* ---- cài đặt ---- */
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:6rem;min-height:3rem;border-radius:16px;border:2.5px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);font-weight:900;margin-bottom:4px}
.seg button.on{border-color:#7CC4F2;background:var(--bs);color:var(--b);box-shadow:0 4px 0 #7CC4F2}
.set{padding:16px 0;border-bottom:2px solid #F1ECE2}.set:last-child{border-bottom:none}
.set .lb{font-weight:900;margin-bottom:10px;font-size:1.05rem}
.note{background:var(--ys);border:2.5px solid #F5DC9A;border-radius:18px;padding:12px 14px;font-size:.95rem;margin:12px 0}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lg{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:20px;border:2.5px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);font-weight:900;font-size:1.1rem;margin-bottom:5px}
.lg .flag{width:3.4rem;height:2.3rem;border-radius:8px}
.lg.on{border-color:#7CC4F2;background:var(--bs);color:var(--bd);box-shadow:0 5px 0 #7CC4F2}
.big-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.bs{background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:14px;display:flex;align-items:center;gap:10px}
.bs i{font-style:normal;font-size:1.9rem}.bs b{display:block;font-size:1.4rem;font-weight:900;line-height:1.1}.bs span{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;border-radius:8px;padding:1px 7px;font-size:.78rem;font-weight:900;margin-right:6px;vertical-align:2px}
.pill.en{background:#DCEBFA;color:var(--bd)}.pill.fr{background:#FBE1E1;color:var(--rd)}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div id="layer"></div>
<script>
/* ===== DỮ LIỆU: [tiếng Việt, tiếng Anh, tiếng Pháp] ===== */
const TOPICS=[

{name:'Sức khỏe',icon:'🩺',words:[

{name:'Thời gian',icon:'🕰️',words:[

sents:[
['Bây giờ là mấy giờ?','What time is it now?','Quelle heure est-il maintenant ?'],
['Hôm nay là Chủ nhật.','Today is Sunday.',"Aujourd'hui, c'est dimanche."],
['Tôi đi chợ vào thứ Hai.','I go to the market on Monday.','Je vais au marché le lundi.'],
['Tôi dậy lúc sáu giờ sáng.','I wake up at six in the morning.','Je me lève à six heures du matin.']]},
{name:'Nhà cửa',icon:'🏠',words:[

const store={get(k,d){try{const v=localStorage.getItem('ontu_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ontu_'+k,JSON.stringify(v))}catch(e){}}};
const S={lang:store.get('lang','en'),rate:store.get('rate',0.8),big:store.get('big',false)};
document.documentElement.classList.toggle('big',S.big);
const L=()=>S.lang==='en'?1:2;
const langName=()=>S.lang==='en'?'tiếng Anh':'tiếng Pháp';
const dkey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function markDay(){const a=store.get('days',[]),k=dkey(new Date());if(!a.includes(k)){a.push(k);store.set('days',a.slice(-400))}}
function streak(){const s=new Set(store.get('days',[]));const d=new Date();if(!s.has(dkey(d)))d.setDate(d.getDate()-1);let n=0;while(s.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
const bkey=(t,m)=>`${S.lang}|${t}|${m}`;
const best=(t,m)=>{const v=store.get('best',{})[bkey(t,m)];return v==null?null:v};
let tab='home';

/* ===== GIỌNG ĐỌC ===== */
let voices=[];
const hasTTS='speechSynthesis' in window;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(!document.querySelector('.shade,.foot')){if(tab==='home')home();else if(tab==='set')settings()}}}
const norm=l=>(l||'').toLowerCase().replace('_','-');
function pickVoice(l){
  const c=voices.filter(v=>norm(v.lang).startsWith(l));if(!c.length)return null;
  const pref=l==='en'?['en-us','en-gb','en-au']:['fr-fr','fr-ca','fr-be'];
  const good=/google|natural|premium|enhanced|neural|samantha|daniel|thomas|am[eé]lie|audrey|aurelie|denise|jenny|aria/i;
  for(const p of pref){const g=c.find(v=>norm(v.lang)===p&&good.test(v.name));if(g)return g}
  for(const p of pref){const g=c.find(v=>norm(v.lang)===p);if(g)return g}
  return c[0];
}
function speak(text,slow){
  if(!hasTTS)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=S.lang==='en'?'en-US':'fr-FR';const v=pickVoice(S.lang);if(v)u.voice=v;u.rate=slow?Math.max(.45,S.rate-.3):S.rate;setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},80)}catch(e){}
}
const SAY=[];
function say(i,s){speak(SAY[i],!!s)}
function spk(text,slow,extra){SAY.push(text);return `<button class="spk ${slow?'slow':''} ${extra||''}" aria-label="${slow?'Nghe chậm':'Nghe'}" onclick="say(${SAY.length-1},${slow?1:0})">${slow?'🐢':'🔊'}</button>`}

/* ===== TIỆN ÍCH ===== */
const app=document.getElementById('app'),layer=document.getElementById('layer');
function view(html){app.innerHTML=html;layer.innerHTML='';window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=x=>String(Math.round(x*10)/10).replace('.',',');
function tokenize(s){const o=[];s.split(' ').forEach(t=>{if(/^[?!:;»]+$/.test(t)&&o.length)o[o.length-1]+=' '+t;else o.push(t)});return o}
const MODE={learn:'Học từ',quiz:'Kiểm tra từ',sent:'Ghép câu'};
const PRAISE=['Tuyệt vời!','Giỏi quá!','Chính xác!','Rất tốt!','Hay lắm!'];
const flag=()=>`<span class="flag ${S.lang}"></span>`;
function topBar(){return `<div class="bar-top">
  <button class="chip lang" onclick="toggleLang()" aria-label="Đổi ngôn ngữ">${flag()} ${S.lang==='en'?'Tiếng Anh':'Tiếng Pháp'} ⇄</button>
  <span class="sp"></span>
  <span class="chip streak" title="Chuỗi ngày học">🔥 ${streak()}</span>
  <span class="chip xp" title="Điểm kinh nghiệm">⭐ ${store.get('xp',0)}</span></div>`}
function nav(){layer.innerHTML=`<nav class="nav"><div class="in">
  <button class="${tab==='home'?'on':''}" onclick="home()"><i>🏠</i>Học</button>
  <button class="${tab==='hist'?'on':''}" onclick="history()"><i>🏆</i>Bảng điểm</button>
  <button class="${tab==='set'?'on':''}" onclick="settings()"><i>⚙️</i>Cài đặt</button></div></nav>`}
function voiceWarn(){
  if(!hasTTS)return `<div class="note">⚠️ Trình duyệt này không đọc được. Hãy mở bằng Chrome hoặc Safari để nghe phát âm.</div>`;
  if(voices.length&&!pickVoice(S.lang))return `<div class="note">⚠️ Máy chưa có giọng đọc ${langName()}. Vào <b>Cài đặt → Ngôn ngữ / Giọng nói</b> của điện thoại để tải thêm.</div>`;
  return '';
}
function toggleLang(){S.lang=S.lang==='en'?'fr':'en';store.set('lang',S.lang);tab==='hist'?history():tab==='set'?settings():home()}

/* ===== TRANG CHÍNH: LỘ TRÌNH ===== */
function home(){
  tab='home';
  const h=new Date().getHours(),st=streak();
  const hi=h<11?'Chào buổi sáng!':h<14?'Chào buổi trưa!':h<18?'Chào buổi chiều!':'Chào buổi tối!';
  const offs=[0,45,70,45,0,-45,-70,-45];
  const nodes=TOPICS.map((t,i)=>{
    const c=COL[i],b=best(i,'quiz'),n=b==null?0:b>=9?3:b>=7?2:b>=5?1:0;
    return `<button class="node" style="transform:translateX(${offs[i%8]}px)" onclick="sheet(${i})">
      <span class="dot" style="--c:${c[0]};--cd:${c[1]};--ring:${b!=null?c[0]:'var(--line)'}">${t.icon}</span>
      <span class="nm">${t.name}</span><span class="st">${'<b>★</b>'.repeat(n)}${'★'.repeat(3-n)}</span></button>`}).join('');
  view(`${topBar()}
  <div class="hello">${bear(84)}<div class="bubble">${hi}<small>${st>0?`Đã học ${st} ngày liên tiếp — giỏi quá!`:'Hôm nay mình ôn vài từ nhé?'}</small></div></div>
  ${voiceWarn()}
  <div class="unit"><b>Phần 1 · Từ vựng hằng ngày</b><span>8 chủ đề · ${langName()} · bấm vào một vòng tròn để bắt đầu</span></div>
  <div class="path" style="overflow:hidden">${nodes}
    <button class="node trophy" onclick="sheet('all')"><span class="dot" style="--ring:var(--y)">🏆</span><span class="nm">Ôn tổng hợp</span><span class="st"></span></button>
  </div>`);
  nav();
}

/* ===== BẢNG CHỌN BÀI ===== */
function sheet(t){
  const all=t==='all',T=all?{name:'Ôn tổng hợp',icon:'🏆'}:TOPICS[t],c=all?['#FFC233','#D99B0B','#FFF5D9']:COL[t];
  const bs=m=>{const b=best(t,m);return b==null?'':`<span class="best">${fmt(b)}/10</span>`};
  const arg=JSON.stringify(t);
  layer.insertAdjacentHTML('beforeend',`<div class="shade" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog">
    <div class="hd"><span class="ic" style="background:${c[2]}">${T.icon}</span><div><h3>${T.name}</h3><span style="color:var(--muted)">${langName()}</span></div></div>
    ${all?'':`<button class="act" onclick='closeSheet();learn(${arg})'><span class="e" style="background:var(--bs)">📖</span><div><b>Học từ</b><span>Xem từ, nghe phát âm chuẩn</span></div></button>`}
    <button class="act" onclick='closeSheet();startQuiz(${arg})'><span class="e" style="background:var(--gs)">✅</span><div><b>Kiểm tra từ</b><span>10 câu · chấm điểm</span></div>${bs('quiz')}</button>
    <button class="act" onclick='closeSheet();startSent(${arg})'><span class="e" style="background:var(--ys)">🧩</span><div><b>Ghép câu</b><span>Xếp từ thành câu đúng</span></div>${bs('sent')}</button>
    <button class="btn plain" onclick="closeSheet()">Để sau</button></div></div>`);
}
function closeSheet(){const s=document.querySelector('.shade');if(s)s.remove()}
function quit(){
  layer.insertAdjacentHTML('beforeend',`<div class="shade" onclick="if(event.target===this)closeSheet()"><div class="sheet center" style="text-align:center">
    ${bear(90,'oops')}<h3 style="margin:8px 0 6px">Dừng bài học bây giờ?</h3><p style="color:var(--muted);margin:0 0 18px">Kết quả bài này sẽ không được lưu.</p>
    <button class="btn blue" onclick="closeSheet()">Học tiếp</button><div style="height:10px"></div><button class="btn plain" style="color:var(--r)" onclick="home()">Dừng lại</button></div></div>`);
}

/* ===== KHUNG BÀI HỌC ===== */
function lesson(done,total,body,foot,cls){
  app.innerHTML=`<div class="lesson-top"><button class="x" onclick="quit()" aria-label="Thoát">✕</button><div class="pbar"><i style="width:${Math.round(done/total*100)}%"></i></div><span class="count">${Math.min(done+1,total)}/${total}</span></div>${body}<div style="height:${cls?'15rem':'8rem'}"></div>`;
  layer.innerHTML=`<div class="foot ${cls||''}"><div class="in">${foot}</div></div>`;
}
function fbBox(ok,title,text){return `<div class="fb"><span class="badge">${ok?'✅':'❌'}</span><div><b>${title}</b><span>${text}</span></div></div>`}

/* ===== HỌC TỪ ===== */
let LS;
function learn(t){LS={t,i:0};window.scrollTo(0,0);learnView()}
function learnView(){
  const T=TOPICS[LS.t],c=COL[LS.t];
  if(LS.i>=T.words.length)return learnDone();
  const w=T.words[LS.i],f=w[L()];
  lesson(LS.i,T.words.length,`
    <div class="q-title">Từ mới</div>
    <div class="flash" style="border-color:${c[0]};border-bottom-color:${c[1]}">
      <span class="tag" style="background:${c[2]};color:${c[1]}">${T.icon} ${T.name}</span>
      <div class="w" style="color:${c[1]}">${f}</div><div class="m">${w[0]}</div>
      <div class="ctl">${spk(f,0,'big')}${spk(f,1,'big')}</div></div>
    <div class="hello">${bear(70)}<div class="bubble">Nghe 2–3 lần rồi đọc to theo nhé!</div></div>`,
  `<div class="row2"><button class="btn plain" style="flex:0 0 5rem" ${LS.i===0?'disabled':''} onclick="LS.i--;learnView()" aria-label="Từ trước">◀</button><button class="btn" onclick="LS.i++;learnView()">Tiếp tục</button></div>`);
  speak(f);
}
function learnDone(){
  const T=TOPICS[LS.t];markDay();
  lesson(1,1,`<div class="res">${bear(120,'cheer')}<h1>Học xong ${T.words.length} từ!</h1><p style="color:var(--muted);margin:0 0 6px">Nghe thêm các câu mẫu của chủ đề ${T.name}:</p></div>
    <div class="card">${T.sents.map(s=>`<div class="li"><div class="t"><b>${s[L()]}</b><span>${s[0]}</span></div>${spk(s[L()])}</div>`).join('')}</div>`,
  `<div class="row2"><button class="btn blue" onclick="startSent(${LS.t})">🧩 Ghép câu</button><button class="btn" onclick="startQuiz(${LS.t})">✅ Kiểm tra</button></div>`);
  launchConfetti();
}

/* ===== KIỂM TRA TỪ ===== */
let Q;
function startQuiz(t){
  const pool=t==='all'?TOPICS.flatMap(x=>x.words):TOPICS[t].words;
  Q={t,qs:shuffle(pool).slice(0,10).map((w,k)=>({w,type:k%2?'vi2f':'f2vi',opts:shuffle([w,...shuffle(pool.filter(x=>x!==w)).slice(0,3)])})),i:0,score:0,wrong:[],sel:null,checked:false};
  window.scrollTo(0,0);quizView(true);
}
function quizView(first){
  const q=Q.qs[Q.i],f=q.w[L()];
  const lab=o=>q.type==='f2vi'?o[0]:o[L()];
  const opts=q.opts.map((o,k)=>{let c='';if(Q.checked){if(o===q.w)c='right';else if(k===Q.sel)c='wrong'}else if(k===Q.sel)c='sel';
    return `<button class="opt ${c}" ${Q.checked?'disabled':''} onclick="selQ(${k})"><span class="k">${k+1}</span>${lab(o)}</button>`}).join('');
  const head=q.type==='f2vi'
    ?`<div class="q-title">Từ này nghĩa là gì?</div><div class="word-card">${spk(f,0,'big')}<div><div class="w">${f}</div><div style="margin-top:4px">${spk(f,1)}</div></div></div>`
    :`<div class="q-title">Chọn từ ${langName()} có nghĩa là:</div><div class="word-card"><div style="font-size:3rem">🇻🇳</div><div class="w">${q.w[0]}</div></div><p style="color:var(--muted);margin:-4px 0 12px;font-size:.9rem">Bấm vào một đáp án để nghe thử, rồi bấm KIỂM TRA.</p>`;
  let foot,cls='';
  if(!Q.checked)foot=`<button class="btn" ${Q.sel==null?'disabled':''} onclick="checkQ()">Kiểm tra</button>`;
  else{const ok=q.opts[Q.sel]===q.w;cls=ok?'ok':'bad';
    foot=fbBox(ok,ok?PRAISE[Q.i%PRAISE.length]:'Đáp án đúng là:',`${f} = ${q.w[0]}`)+`<div class="row2">${spk(f)}<button class="btn ${ok?'':'red'}" onclick="nextQ()">${Q.i<Q.qs.length-1?'Tiếp tục':'Xem điểm'}</button></div>`}
  lesson(Q.i+(Q.checked?1:0),Q.qs.length,head+`<div class="opts">${opts}</div>`,foot,cls);
  if(first&&q.type==='f2vi')speak(f);
}
function selQ(k){if(Q.checked)return;Q.sel=k;const q=Q.qs[Q.i];quizView(false);if(q.type==='vi2f')speak(q.opts[k][L()])}
function checkQ(){if(Q.sel==null)return;const q=Q.qs[Q.i];Q.checked=true;if(q.opts[Q.sel]===q.w)Q.score++;else Q.wrong.push([q.w[0],q.w[L()]]);quizView(false);speak(q.w[L()])}
function nextQ(){Q.sel=null;Q.checked=false;Q.i++;window.scrollTo(0,0);if(Q.i>=Q.qs.length)finish('quiz',Q.t,Q.score/Q.qs.length*10,Q.wrong,`Đúng ${Q.score}/${Q.qs.length} câu`);else quizView(true)}

/* ===== GHÉP CÂU ===== */
let G;
function startSent(t){const pool=t==='all'?TOPICS.flatMap(x=>x.sents):TOPICS[t].sents;G={t,items:shuffle(pool).slice(0,5),i:0,pts:0,wrong:[]};newSent()}
function newSent(){
  const toks=tokenize(G.items[G.i][L()]);let order=shuffle(toks.map((x,i)=>i));
  for(let n=0;n<10&&toks.length>1&&order.every((v,i)=>v===i);n++)order=shuffle(order);
  Object.assign(G,{toks,order,picked:[],tries:0,state:'play'});window.scrollTo(0,0);sentView();
}
function sentView(){
  const s=G.items[G.i],full=s[L()],end=G.state==='ok'||G.state==='shown';
  const line=G.picked.length?G.picked.map((ti,j)=>`<button class="tile" ${end?'disabled':''} onclick="unpick(${j})">${G.toks[ti]}</button>`).join(''):`<span class="ph">Bấm vào các từ bên dưới theo đúng thứ tự…</span>`;
  const pool=G.order.map(ti=>`<span class="slot"><button class="tile ${G.picked.includes(ti)?'used':''}" onclick="pick(${ti})">${G.toks[ti]}</button></span>`).join('');
  let foot,cls='';
  if(G.state==='play')foot=`<div class="row2"><button class="btn plain" style="flex:0 0 auto;width:auto" onclick="G.picked=[];sentView()">↺ Xếp lại</button><button class="btn" ${G.picked.length<G.toks.length?'disabled':''} onclick="checkSent()">Kiểm tra</button></div>`;
  else if(G.state==='bad'){cls='bad';foot=fbBox(false,'Chưa đúng thứ tự','Bấm vào từ ở trên để gỡ ra, rồi xếp lại nhé.')+`<div class="row2">${G.tries>=2?`<button class="btn plain" onclick="showSent()">Xem đáp án</button>`:''}<button class="btn red" onclick="G.state='play';sentView()">Thử lại</button></div>`}
  else if(G.state==='ok'){cls='ok';foot=fbBox(true,`${PRAISE[G.i%PRAISE.length]} ${G.tries===1?'+2 điểm':'+1 điểm'}`,full)+`<div class="row2">${spk(full)}<button class="btn" onclick="nextSent()">${G.i<G.items.length-1?'Tiếp tục':'Xem điểm'}</button></div>`}
  else{cls='bad';foot=fbBox(false,'Đáp án đúng là:',full)+`<div class="row2">${spk(full)}<button class="btn red" onclick="nextSent()">${G.i<G.items.length-1?'Tiếp tục':'Xem điểm'}</button></div>`}
  lesson(G.i+(end?1:0),G.items.length,`
    <div class="q-title">Ghép thành câu ${langName()}</div>
    <div class="hint-row">${bear(64,end&&G.state==='ok'?'cheer':'happy')}<div class="vi-box">“${s[0]}”<div style="margin-top:8px">${spk(full,1)}<span style="color:var(--muted);font-size:.85rem;margin-left:8px">nghe gợi ý</span></div></div></div>
    <div class="lines">${line}</div>${end?'':`<div class="pool">${pool}</div>`}`,foot,cls);
}
function pick(ti){if(G.state!=='play'&&G.state!=='bad')return;if(G.picked.includes(ti))return;G.picked.push(ti);G.state='play';sentView();speak(G.toks[ti])}
function unpick(j){G.picked.splice(j,1);G.state='play';sentView()}
function checkSent(){G.tries++;const ok=G.picked.map(i=>G.toks[i]).join(' ')===G.toks.join(' ');if(ok){G.state='ok';G.pts+=G.tries===1?2:1;speak(G.items[G.i][L()])}else G.state='bad';sentView()}
function showSent(){G.state='shown';G.picked=G.toks.map((x,i)=>i);const s=G.items[G.i];G.wrong.push([s[0],s[L()]]);sentView();speak(s[L()],true)}
function nextSent(){G.i++;if(G.i>=G.items.length)finish('sent',G.t,G.pts/(G.items.length*2)*10,G.wrong,`${G.pts}/${G.items.length*2} điểm thô`);else newSent()}

/* ===== KẾT QUẢ ===== */
let R;
function finish(mode,t,s10,wrong,detail){
  s10=Math.round(s10*10)/10;
  const topic=t==='all'?'Ôn tổng hợp':TOPICS[t].name,xp=Math.round(s10)*2+2;
  const h=store.get('hist',[]);h.unshift({d:Date.now(),lang:S.lang,mode,topic,s:s10});store.set('hist',h.slice(0,60));
  const b=store.get('best',{}),k=bkey(t,mode);if(b[k]==null||s10>b[k]){b[k]=s10;store.set('best',b)}
  store.set('xp',store.get('xp',0)+xp);markDay();
  R={mode,t,s10,wrong,detail,xp};resultView();
}
function resultView(){
  const s=R.s10,col=s>=7?'var(--g)':s>=5?'var(--yd)':'var(--r)',C=326.7;
  const msg=s>=9?'Xuất sắc! Trí nhớ rất tốt 👏':s>=7?'Rất tốt! Ôn thêm chút là hoàn hảo.':s>=5?'Khá lắm! Nghe lại các mục bên dưới nhé.':'Không sao cả, cứ từ từ. Thử lại lần nữa nhé!';
  const again=R.mode==='quiz'?`startQuiz(${JSON.stringify(R.t)})`:`startSent(${JSON.stringify(R.t)})`;
  app.innerHTML=`<div class="res">${bear(120,s>=5?'cheer':'happy')}
    <h1>Hoàn thành bài học!</h1><div style="color:var(--muted)">${MODE[R.mode]} · ${langName()}</div>
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ECE8DF" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*s/10} ${C}"/></svg>
      <div class="v"><b style="color:${col}">${fmt(s)}</b><span>trên 10 điểm</span></div></div>
    <div style="font-size:1.15rem">${msg}</div>
    <div class="stats">
      <div class="stat" style="border-color:var(--g)"><div class="h" style="background:var(--g)">Kết quả</div><div class="n" style="color:var(--gd);font-size:1.05rem">${R.detail}</div></div>
      <div class="stat" style="border-color:var(--y)"><div class="h" style="background:var(--yd)">Kinh nghiệm</div><div class="n" style="color:var(--yd)">⭐ +${R.xp}</div></div>
      <div class="stat" style="border-color:var(--o)"><div class="h" style="background:var(--o)">Chuỗi ngày</div><div class="n" style="color:var(--o)">🔥 ${streak()}</div></div>
    </div></div>
    ${R.wrong.length?`<h2 class="h">Cần ôn lại (${R.wrong.length})</h2><div class="card">${R.wrong.map(w=>`<div class="li"><div class="t"><b>${w[1]}</b><span>${w[0]}</span></div>${spk(w[1])}${spk(w[1],1)}</div>`).join('')}</div>`:''}
    <div style="height:8rem"></div>`;
  layer.innerHTML=`<div class="foot"><div class="in row2"><button class="btn white" onclick='${again}'>↺ Làm lại</button><button class="btn" onclick="home()">Tiếp tục</button></div></div>`;
  window.scrollTo(0,0);
  if(s>=7)launchConfetti();
}
function launchConfetti(){
  const box=document.createElement('div');box.className='confetti';
  const cs=['#1F9D3A','#FFC233','#1A8FD8','#E8579B','#FF7A3D','#7B5CF0'];
  for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cs[i%cs.length];e.style.animationDuration=(2.2+Math.random()*2)+'s';e.style.animationDelay=(Math.random()*.6)+'s';box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),5000);
}

/* ===== BẢNG ĐIỂM ===== */
let clearArm=false;
function history(){
  tab='hist';clearArm=false;
  const h=store.get('hist',[]);
  const avg=l=>{const a=h.filter(x=>x.lang===l);return a.length?fmt(a.reduce((s,x)=>s+x.s,0)/a.length):'–'};
  const d=t=>{const x=new Date(t);return `${x.getDate()}/${x.getMonth()+1} lúc ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`};
  const c=s=>s>=7?'var(--g)':s>=5?'var(--yd)':'var(--r)';
  view(`${topBar()}
  <h2 class="h">Thành tích của bạn</h2>
  <div class="big-stats">
    <div class="bs"><i>🔥</i><div><b>${streak()}</b><span>ngày liên tiếp</span></div></div>
    <div class="bs"><i>⭐</i><div><b>${store.get('xp',0)}</b><span>điểm kinh nghiệm</span></div></div>
    <div class="bs"><span class="flag en" style="width:2.2rem;height:1.5rem"></span><div><b>${avg('en')}</b><span>điểm TB tiếng Anh</span></div></div>
    <div class="bs"><span class="flag fr" style="width:2.2rem;height:1.5rem"></span><div><b>${avg('fr')}</b><span>điểm TB tiếng Pháp</span></div></div>
  </div>
  <h2 class="h">Các bài đã làm</h2>
  <div class="card">${h.length?h.map(x=>`<div class="li"><div class="t"><b><span class="pill ${x.lang}">${x.lang.toUpperCase()}</span>${MODE[x.mode]}</b><span>${x.topic} · ${d(x.d)}</span></div><b style="font-size:1.2rem;color:${c(x.s)}">${fmt(x.s)}/10</b></div>`).join(''):`<div style="text-align:center;padding:14px 0">${bear(80)}<p style="color:var(--muted)">Chưa có bài nào. Làm một bài kiểm tra nhé!</p></div>`}</div>
  ${h.length?`<div style="height:16px"></div><button class="btn plain" id="clr" onclick="clearHist()">🗑 Xóa bảng điểm</button>`:''}
  <p style="color:var(--muted);text-align:center;font-size:.9rem">Điểm được lưu trên chính máy này.</p>`);
  nav();
}
function clearHist(){
  if(!clearArm){clearArm=true;const b=document.getElementById('clr');b.textContent='Bấm lần nữa để xóa hẳn';b.style.color='var(--r)';return}
  ['hist','best','xp','days'].forEach(k=>store.set(k,k==='xp'?0:k==='best'?{}:[]));history();
}

/* ===== CÀI ĐẶT ===== */
function settings(){
  tab='set';
  view(`${topBar()}<h2 class="h">Cài đặt</h2>
  <div class="card">
    <div class="set"><div class="lb">Ngôn ngữ muốn học</div><div class="langs">
      <button class="lg ${S.lang==='en'?'on':''}" onclick="S.lang='en';store.set('lang','en');settings()"><span class="flag en"></span>Tiếng Anh</button>
      <button class="lg ${S.lang==='fr'?'on':''}" onclick="S.lang='fr';store.set('lang','fr');settings()"><span class="flag fr"></span>Tiếng Pháp</button></div></div>
    <div class="set"><div class="lb">Tốc độ đọc</div><div class="seg">${[[.6,'Rất chậm'],[.8,'Chậm'],[1,'Bình thường']].map(([r,t])=>`<button class="${S.rate===r?'on':''}" onclick="S.rate=${r};store.set('rate',${r});settings()">${t}</button>`).join('')}</div></div>
    <div class="set"><div class="lb">Cỡ chữ</div><div class="seg"><button class="${!S.big?'on':''}" onclick="setBig(false)">Chữ lớn</button><button class="${S.big?'on':''}" onclick="setBig(true)">Chữ rất lớn</button></div></div>
    <div class="set"><div class="lb">Thử giọng đọc</div><div style="display:flex;gap:12px;align-items:center">${spk(S.lang==='en'?'Hello! Nice to meet you.':'Bonjour ! Enchanté.')}<span style="color:var(--muted)">${S.lang==='en'?'Hello! Nice to meet you.':'Bonjour ! Enchanté.'}</span></div>${voiceWarn()}</div>
  </div>`);
  nav();
}
function setBig(b){S.big=b;store.set('big',b);document.documentElement.classList.toggle('big',b);settings()}

home();
</script>
</body>
</html>
